<!DOCTYPE html>
<html lang="uz">
<head>
<style>*{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}input,textarea,select{-webkit-user-select:text!important;user-select:text!important}</style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SavdoUz</title>
<style>
:root{--ink:#150F2E;--v:#6C4BF4;--vd:#4E2FD9;--vl:#F1EDFE;--bg:#F5F4FA;--card:#fff;--mut:#8A8497;--line:#ECE9F5;--red:#F23557;--or:#FF6B35;--grn:#1E7E34;--toast:#150F2E;--vt:#4E2FD9;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#F2EFFA;--vl:#2A2250;--bg:#0F0B1F;--card:#1A1530;--mut:#A49FB8;--line:#2D2750;--toast:#3A3263;--vt:#B7A5FF;}:root:not([data-theme=light]) .usdstrip .ch.o b{color:#4CC46A}:root:not([data-theme=light]) .usdstrip .ch.s b{color:#FF7A92}}
:root[data-theme=dark]{--ink:#F2EFFA;--vl:#2A2250;--bg:#0F0B1F;--card:#1A1530;--mut:#A49FB8;--line:#2D2750;--toast:#3A3263;--vt:#B7A5FF;}:root[data-theme=dark] .usdstrip .ch.o b{color:#4CC46A}:root[data-theme=dark] .usdstrip .ch.s b{color:#FF7A92}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Tahoma,sans-serif}
.app{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
svg{display:block}
input,select,textarea{font-family:inherit;font-size:14px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);width:100%;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--v)}
button{font-family:inherit;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
label{font-size:12.5px;color:var(--mut);font-weight:700;margin-bottom:6px;display:block}
.field{margin-bottom:13px}
.authwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 26px}
.authlogo{width:84px;height:84px;border-radius:24px;display:block;object-fit:contain;margin:0 auto 18px}
.authtitle{text-align:center;font-size:23px;font-weight:800;margin-bottom:4px}
.authsub{text-align:center;font-size:13px;color:var(--mut);margin-bottom:28px}
.roletabs{display:flex;background:var(--vl);border-radius:14px;padding:4px;margin-bottom:16px}
.roletab{flex:1;text-align:center;padding:9px 0;font-size:13px;border-radius:11px;font-weight:700;color:var(--vt);opacity:.55;cursor:pointer}
.roletab.active{background:var(--card);opacity:1}
.primarybtn,.checkout{width:100%;background:linear-gradient(135deg,var(--v),var(--vd));color:#fff;border:none;border-radius:15px;padding:14px;font-weight:800;font-size:14.5px;margin-top:6px;box-shadow:0 8px 18px -6px rgba(108,75,244,.5)}
.switchmode{text-align:center;margin-top:18px;font-size:13px;color:var(--mut)}
.switchmode b{color:var(--vt);cursor:pointer}
.errmsg{background:#FEECEF;color:var(--red);font-size:12.5px;padding:10px 13px;border-radius:12px;margin-bottom:12px;display:none;font-weight:600}
header{background:linear-gradient(135deg,var(--v),var(--vd));padding:16px 18px 18px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 22px 22px;box-shadow:0 6px 20px -8px rgba(108,75,244,.5)}
.brandrow{display:flex;gap:10px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;display:block;object-fit:contain}
.bname{font-size:17px;font-weight:800;color:#fff}
.bsubline{font-size:11px;color:rgba(255,255,255,.85)}
.logoutbtn{background:rgba(255,255,255,.18);border:none;border-radius:11px;padding:8px 13px;font-size:11.5px;color:#fff;font-weight:700}
main{flex:1;padding:16px 16px 92px}
.sectitle{font-size:17px;font-weight:800;margin-bottom:12px}
.cats,.sortrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.cat,.sortchip{flex:0 0 auto;padding:8px 15px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.sortchip{padding:7px 13px;font-size:11.5px}
.cat.active{background:var(--v);color:#fff;border-color:var(--v)}
.sortchip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 4px 16px -6px rgba(21,15,46,.1)}
.pimg{height:110px;background:var(--vl);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.pimg svg{width:44px;height:44px}
.pimg img{width:100%;height:100%;object-fit:cover}
.heartbtn{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);border:none;font-size:13px;z-index:2}
.discbadge{position:absolute;top:7px;left:7px;background:var(--or);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;z-index:2}
.oldprice{font-size:11px;color:var(--mut);text-decoration:line-through;margin-right:5px}
.searchbar{position:relative;margin-bottom:12px}
.searchbar input{padding-left:38px;border-radius:16px}
.sicon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.5}
.storehead{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
.storeavatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--v),var(--vd));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px}
.lowstock{color:var(--or);font-weight:700}
.salebadge{position:absolute;bottom:7px;left:7px;background:var(--v);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;z-index:2}
.weekbox{background:var(--v);border-radius:22px;padding:14px;margin-bottom:14px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.hscroll .pcard{flex:0 0 160px;scroll-snap-align:start}
.hscroll.wrap{flex-wrap:wrap;overflow:visible}
.hscroll.wrap .pcard{flex:0 0 calc(50% - 6px)}
.seeall{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:12px;padding:6px 12px;font-size:11.5px;font-weight:700}
/* ---- Reklama (banner) ---- */
.adwrap{margin-bottom:14px}
.adtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.adtrack::-webkit-scrollbar{display:none}
.adslide{flex:0 0 100%;scroll-snap-align:center;position:relative;aspect-ratio:3/1;background:var(--vl);cursor:pointer}
.adslide img{width:100%;height:100%;object-fit:cover;display:block}
.adtag{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.45);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}
.addots{display:flex;justify-content:center;gap:5px;margin-top:7px}
.addots i{width:6px;height:6px;border-radius:50%;background:#D7CCFB;transition:all .2s}
.addots i.on{background:var(--v);width:16px;border-radius:4px}
.adslot{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1.5px dashed #D7CCFB;border-radius:20px;padding:14px 16px;margin-bottom:14px;font-size:12.5px;font-weight:700;color:var(--vt)}
.adslot small{display:block;font-weight:500;color:var(--mut);font-size:11px;margin-top:2px}
.adslot button{flex:0 0 auto;background:var(--v);color:#fff;border:none;border-radius:12px;padding:9px 14px;font-size:12px;font-weight:800}
.chatwrap{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.chatmsg{max-width:78%;padding:9px 13px;border-radius:14px;font-size:12.5px;line-height:1.4;word-break:break-word}
.chatmsg.mine{align-self:flex-end;background:var(--v);color:#fff;border-bottom-right-radius:4px}
.chatmsg.theirs{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.who{font-size:9.5px;opacity:.7;margin-bottom:2px;font-weight:700}
.chatinput{display:flex;gap:8px}
.chatinput button{background:var(--v);color:#fff;border:none;border-radius:14px;padding:0 18px;font-weight:800}
.banner{background:linear-gradient(120deg,var(--v),#9B7BFF);border-radius:20px;padding:18px;margin-bottom:14px;color:#fff}
.btitle{font-size:16px;font-weight:800;margin-bottom:3px}
.bsub{font-size:12px;opacity:.9}
.detailimg{width:100%;height:220px;border-radius:18px;overflow:hidden;background:var(--vl);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.detailimg img{width:100%;height:100%;object-fit:cover}
.detailimg svg{width:70px;height:70px}
.backbtn{background:var(--vl);color:var(--vt);border:none;border-radius:12px;padding:8px 14px;font-size:12.5px;font-weight:700;margin-bottom:12px}
.reviewitem,.citem,.oitem,.summary,.addform{background:var(--card);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 3px 12px -6px rgba(21,15,46,.09)}
.pbody{padding:11px 12px 13px}
.tag{display:inline-block;background:var(--vl);color:var(--vt);font-size:9.5px;font-weight:800;padding:4px 8px;border-radius:8px;margin-bottom:6px}
.pname{font-size:13px;font-weight:700;line-height:1.25;margin-bottom:2px;cursor:pointer}
.pseller{font-size:10.5px;color:var(--mut);margin-bottom:5px}
.price{font-weight:800;font-size:15px;margin-bottom:8px}
.addbtn{width:100%;background:linear-gradient(135deg,var(--v),var(--vd));color:#fff;border:none;border-radius:13px;padding:9px 0;font-size:11.5px;font-weight:800}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:60px 20px;line-height:1.6}
.empty.err{color:var(--red)}
.citem{display:flex;justify-content:space-between;align-items:center}
.cname{font-size:13px;font-weight:700}
.cprice{font-size:12px;color:var(--vt);font-weight:800;margin-top:2px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:27px;height:27px;border-radius:9px;border:none;background:var(--vl);color:var(--vt);font-size:15px;font-weight:800}
.sumrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:var(--mut)}
.sumrow.total{font-weight:800;font-size:16px;margin-top:6px;color:var(--ink)}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut);margin-bottom:7px}
.status{display:inline-block;padding:4px 10px;border-radius:9px;font-size:10.5px;font-weight:800;background:var(--vl);color:var(--vt);white-space:nowrap}
.oline{font-size:12.5px;display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.ototal{font-weight:800;margin-top:9px;padding-top:9px;border-top:1.5px dashed var(--line);display:flex;justify-content:space-between}
select.statusSel{margin-top:9px;font-size:12px;padding:9px 11px}
.imgpreview{width:100%;height:140px;border-radius:15px;background:var(--vl);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;border:1.5px dashed #D7CCFB}
.imgpreview img{width:100%;height:100%;object-fit:cover}
.imgpreview span{font-size:12px;color:var(--mut)}
nav{position:fixed;bottom:12px;left:12px;right:12px;background:var(--card);border-radius:22px;max-width:396px;margin:0 auto;display:flex;box-shadow:0 10px 30px -8px rgba(21,15,46,.25);padding:4px}
.navitem{flex:1;min-width:0;text-align:center;padding:9px 0 7px;font-size:10px;color:var(--mut);cursor:pointer;border-radius:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navitem.active{color:var(--vt);font-weight:800;background:var(--vl)}
.navicon{margin-bottom:2px;display:flex;justify-content:center;font-size:17px}
.badge{position:relative;top:-16px;left:10px;background:var(--red);color:#fff;font-size:9.5px;border-radius:9px;min-width:15px;height:15px;line-height:15px;padding:0 3px;font-weight:700}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--toast);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;opacity:0;transition:all .25s;z-index:20;max-width:380px;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:#FDEDED;color:var(--red);font-size:12px;padding:10px 12px;border-radius:10px;font-weight:600;margin-bottom:12px}
.usdstrip{display:flex;gap:6px;padding:8px 16px 0}
.usdstrip .ch{flex:1;min-width:0;display:flex;align-items:center;gap:7px;text-align:left;background:var(--card);border-radius:12px;padding:6px 8px;box-shadow:0 3px 12px -6px rgba(21,15,46,.15)}
.usdstrip .ch .ci{flex:0 0 28px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.usdstrip .ch .ct{min-width:0;line-height:1.25}
.usdstrip .ch small{display:block;font-size:10.5px;color:var(--mut);font-weight:700;margin:0;white-space:nowrap}
.usdstrip .ch b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usdstrip .ch b i{font-style:normal;font-size:10.5px;color:var(--mut);font-weight:600;margin-left:3px}
.usdstrip .ch.k{background:linear-gradient(135deg,var(--v),var(--vd))}
.usdstrip .ch.k small{color:rgba(255,255,255,.8)}
.usdstrip .ch small+small{margin:2px 0 0}
.usdstrip .ch.k b{color:#fff}
.usdstrip .ch.o b{color:var(--grn)}
.usdstrip .ch.s b{color:var(--red)}
/* ---- Profil (xaridor, sotuvchi, admin) ---- */
.profhero{position:relative;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--v),var(--vd));border-radius:22px;padding:20px 18px;color:#fff;margin-bottom:14px}
.profav{flex:0 0 62px;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.profname{font-size:18px;font-weight:800;line-height:1.2;word-break:break-word}
.profphone{font-size:12.5px;opacity:.9;margin-top:3px}
.profgear{position:absolute;top:12px;right:12px;width:36px;height:36px;border:none;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font-size:17px;line-height:36px;padding:0}
.menu{background:var(--card);border-radius:20px;margin-bottom:12px;overflow:hidden;box-shadow:0 3px 12px -6px rgba(21,15,46,.09)}
.mrow{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.mrow:last-child{border-bottom:none}
.mico{flex:0 0 26px;text-align:center;font-size:19px}
.mgrow{flex:1;min-width:0}
.mval{color:var(--mut);font-size:13px;font-weight:600}
.marr{color:var(--mut);font-size:20px;line-height:1}
.appver{text-align:center;font-size:12px;color:var(--mut);margin:16px 0 8px}
.qa{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 3px 12px -6px rgba(21,15,46,.09)}
.qa b{display:block;font-size:13.5px;margin-bottom:5px}
.qa span{font-size:12.5px;color:var(--mut);line-height:1.5}
.skel{animation:pulse 1.2s ease-in-out infinite}
.skel .pimg{background:var(--line)}
.sk{height:11px;border-radius:6px;background:var(--line);margin-bottom:9px}
.sk.l1{width:40%}.sk.l2{width:80%}.sk.l3{width:60%;height:14px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-8deg)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.navicon.bump{animation:bump .5s}
.newbadge{position:absolute;bottom:7px;right:7px;background:var(--grn);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;z-index:2}
.newbadge.top{background:#F5A623}
.stp{display:flex;margin:6px 0 12px}
.stp.cancel{color:var(--red);font-size:12px;font-weight:700}
.stp .st{flex:1;text-align:center;position:relative;font-size:10px;color:var(--mut);font-weight:600}
.stp .st i{display:flex;width:18px;height:18px;border-radius:50%;background:var(--line);color:#fff;font-size:10px;font-style:normal;align-items:center;justify-content:center;margin:0 auto 4px;position:relative;z-index:1}
.stp .st::before{content:'';position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line)}
.stp .st:first-child::before{display:none}
.stp .st.done i,.stp .st.cur i,.stp .st.done::before,.stp .st.cur::before{background:var(--v)}
.stp .st.cur{color:var(--vt);font-weight:800}
.stp .st.done{color:var(--ink)}
.eico{font-size:52px;line-height:1;margin-bottom:10px}
</style>

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
// Logotip: o'zingizning rasmingiz bo'lsa, shu qatorga data:image/png;base64,... qo'ying
const LOGO = '/logo.png';
(()=>{ const l=document.createElement('link'); l.rel='icon'; l.href=LOGO; document.head.appendChild(l); })();
const $ = id => document.getElementById(id);
const getTheme = () => localStorage.getItem('savdouz_theme') || 'auto';
function applyTheme(t){ if(t==='light' || t==='dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
applyTheme(getTheme());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU') + " so'm";
const fresh = () => ({ token:null, user:null, tab:'home', cat:'Barchasi', cart:{}, img:null, edit:null, receipt:null, sel:null, sellerId:null, prev:'home', search:'', sort:'none', pend:0 });
let S = { ...fresh(), token: localStorage.getItem('savdouz_token') };
const CATS = ["Barchasi","Telefon","Kompyuter","Elektronika","Maishiy texnika","Kiyim","Poyabzal","Aksessuarlar","Go'zallik","Oziq-ovqat","Uy-ro'zg'or","Mebel","Bolalar","Sport","Avto","Qurilish","Kitob","Boshqa"];
const REGIONS = ["Toshkent shahri","Toshkent viloyati","Andijon","Farg'ona","Namangan","Buxoro","Jizzax","Qashqadaryo","Navoiy","Samarqand","Sirdaryo","Surxondaryo","Xorazm","Qoraqalpog'iston"];
const CI = { 'Barchasi':'✨','Telefon':'📱','Kompyuter':'💻','Elektronika':'🔌','Maishiy texnika':'🧺','Kiyim':'👕','Poyabzal':'👟','Aksessuarlar':'👜',"Go'zallik":'💄','Oziq-ovqat':'🍎',"Uy-ro'zg'or":'🏠','Mebel':'🛋️','Bolalar':'🧸','Sport':'⚽','Avto':'🚗','Qurilish':'🧱','Kitob':'📚','Boshqa':'📦' };
let NEWIDS = new Set();
const SKEL = '<div class="grid">' + '<div class="pcard skel"><div class="pimg"></div><div class="pbody"><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div></div>'.repeat(4) + '</div>';
const STEPS = [['yangi','Yangi'],['tasdiqlandi','Tasdiqlandi'],['kuryerga topshirildi','Kuryerda'],['yetkazildi','Yetkazildi']];
function stepper(status){
  if(status==='bekor qilindi') return '<div class="stp cancel">❌ Buyurtma bekor qilindi</div>';
  const idx = Math.max(0, STEPS.findIndex(x => x[0]===status));
  return `<div class="stp">${STEPS.map(([k, l], i) => `<div class="st ${i<idx?'done':i===idx?'cur':''}"><i>${i<=idx ? '✓' : ''}</i><span>${l}</span></div>`).join('')}</div>`;
}
const ICON = '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="10.5" rx="1.2" fill="#2B3543"/><rect x="5.1" y="5.1" width="13.8" height="8.3" fill="#1868E0"/><path d="M2 17.5h20l-1.6-2.5H3.6z" fill="#8892A0"/></svg>';
const APP_VERSION = 'v5';
// Aloqa: faqat Telegram bot (telefon raqam ko'rsatilmaydi)
const CONTACT_TG = 'https://t.me/Savol_24bot';
const CONTACT_BOT = '@Savol_24bot';
// Profil ichidagi sahifalar (barcha rollar uchun)
const COMMON_PROFILE = ['profile','settings','notifs','help','contact'];
const PROFILE_TABS = [...COMMON_PROFILE, 'account', 'ads'];

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2200); }

// ---- API ----
async function api(path, o = {}){
  const h = { 'Content-Type':'application/json' };
  if(S.token) h.Authorization = 'Bearer ' + S.token;
  const c = new AbortController(), t = setTimeout(()=>c.abort(), 40000);
  let res;
  try { res = await fetch(path, { ...o, headers:h, signal:c.signal, cache:'no-store' }); }
  catch(e){ throw new Error(e.name==='AbortError' ? "Server javob bermadi (vaqt tugadi)" : "Server bilan aloqa yo'q"); }
  finally { clearTimeout(t); }
  let d = {};
  try { d = await res.json(); } catch(e){ if(res.ok) throw new Error("Serverdan noto'g'ri javob: " + path); }
  if(!res.ok){
    if(res.status===401 && S.token) logout(true);
    throw new Error(d.error || ('Server xatosi ' + res.status + ': ' + path));
  }
  return d;
}
function logout(expired){
  localStorage.removeItem('savdouz_token');
  S = fresh();
  // Orqaga tugmasi uchun qo'shilgan tarix yozuvini olib tashlaymiz
  if(guard){ guard = false; try { history.back(); } catch(e){} }
  if(expired) toast("Sessiya tugadi, qaytadan kiring");
  renderAuth();
}

function readImage(file){
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onerror = () => no(new Error("Rasmni o'qib bo'lmadi"));
    r.onload = () => {
      const im = new Image();
      im.onerror = () => no(new Error("Rasm formati noto'g'ri"));
      im.onload = () => {
        let w = im.width, h = im.height, m = 700;
        if(w > h && w > m){ h = Math.round(h*m/w); w = m; } else if(h > m){ w = Math.round(w*m/h); h = m; }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        ok(cv.toDataURL('image/jpeg', .72));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
// Reklama rasmi: kengroq (1000 px) va sifati yaxshiroq
function readAdImage(file){
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onerror = () => no(new Error("Rasmni o'qib bo'lmadi"));
    r.onload = () => {
      const im = new Image();
      im.onerror = () => no(new Error("Rasm formati noto'g'ri"));
      im.onload = () => {
        let w = im.width, h = im.height;
        if(w > 1000){ h = Math.round(h * 1000 / w); w = 1000; }
        if(h > 600){ w = Math.round(w * 600 / h); h = 600; }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        ok(cv.toDataURL('image/jpeg', .8));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

  document.querySelectorAll('.roletab').forEach(r => r.onclick = () => { authRole = r.dataset.role; renderAuth(); });

async function submitAuth(){
  const err = $('errmsg'), btn = $('submitBtn');
  err.style.display = 'none';
  const phone = $('fphone').value.trim(), password = $('fpass').value;
  btn.disabled = true;
  try {
    let d;
    if(authMode === 'login') d = await api('/api/login', { method:'POST', body:JSON.stringify({ phone, password }) });
    else {
      const name = $('fname').value.trim();
      if(!name) throw new Error('Ismingizni kiriting');
      const body = { name, phone, password, role:authRole };
      if(authRole === 'seller'){
        const f1 = $('fid').files[0], f2 = $('fself').files[0];
        if(!f1 || !f2) throw new Error('Pasport yoki ID karta va selfi rasmini yuklang');
        body.idDoc = await readImage(f1); body.selfie = await readImage(f2);
      }
      d = await api('/api/register', { method:'POST', body:JSON.stringify(body) });
    }
    S.token = d.token; S.user = d.user; S.tab = 'home';
    localStorage.setItem('savdouz_token', S.token);
    renderApp();
  } catch(e){ err.textContent = e.message; err.style.display = 'block'; btn.disabled = false; }
}

// ---- Ob-havo va 5 vaqt namoz (eng yaqin namozgacha qolgan vaqt) ----
async function loadInfo(){
  const b = $('infoBox'); if(!b) return;
  try {
    const [w, n] = await Promise.all([api('/api/weather'), api('/api/namoz')]);
    const NAMES = [['bomdod','Bomdod'],['peshin','Peshin'],['asr','Asr'],['shom','Shom'],['xufton','Xufton']];
    const now = new Date(), cur = now.getHours()*60 + now.getMinutes();
    const mins = k => { const [h, m] = String(n[k]).split(':').map(Number); return h*60 + m; };
    let next = NAMES.find(([k]) => mins(k) > cur), diff;
    if(next) diff = mins(next[0]) - cur;
    else { next = NAMES[0]; diff = mins('bomdod') + 1440 - cur; } // xufton o'tgan: ertangi bomdod
    const hh = Math.floor(diff/60), mm = diff % 60;
    const left = (hh ? hh + ' soat ' : '') + mm + ' daq';
    const WICON = { 'Ochiq':'☀️', 'Bulutli':'⛅', 'Tuman':'🌫️', "Yomg'ir":'🌧️', 'Jala':'🌦️', 'Qor':'❄️', 'Momaqaldiroq':'⛈️' };
    b.innerHTML = `<div class="ch"><span class="ci" style="background:#FFF1DB">${WICON[w.desc] || '🌤️'}</span><div class="ct"><small>Namangan</small><b>${esc(w.temp)}°C<i>${esc(w.desc)}</i></b></div></div>
      <div class="ch"><span class="ci" style="background:#F1EDFE">🕌</span><div class="ct"><small>${next[1]} · ${esc(n[next[0]])}</small><b>${left}</b></div></div>`;
    b.style.display = '';
  } catch(e){ b.style.display = 'none'; }
}
setInterval(loadInfo, 60 * 1000);

function renderNav(){
  const cnt = Object.values(S.cart).reduce((a,b)=>a+b, 0);
  const r = role();
  const items = r==='admin' ? [['sellers','🏪','Sotuvchilar'],['products','📦','Mahsulotlar'],['buyers','🛍️','Xaridorlar'],['orders','🧾','Buyurtmalar'],['payments','💳',"To'lovlar"],['profile','👤','Profil']]
    : r==='seller' ? [['home','🏠','Mahsulotlarim'],['orders','📦','Buyurtmalar'],['add','➕',"Qo'shish"],['pay','💰',"To'lov"],['profile','👤','Profil']]
    : [['home','🏠','Bosh sahifa'],['favorites','❤️','Sevimlilar'],['cart','🛒','Savat'],['profile','👤','Profil']];
  let active = ['detail','store'].includes(S.tab) ? S.prev : S.tab;
  if(PROFILE_TABS.includes(active) || (r==='buyer' && active==='orders')) active = 'profile';
  const bdg = k => k==='cart' ? cnt : k==='sellers' ? (S.pend || 0) : 0;
  $('nav').innerHTML = items.map(([k,i,l]) => `<div class="navitem ${active===k?'active':''}" data-tab="${k}"><div class="navicon">${i}</div>${l}${bdg(k)>0?`<span class="badge">${bdg(k)}</span>`:''}</div>`).join('');
  if(cnt > (window._lc || 0)){ const ci = $('nav').querySelector('[data-tab="cart"] .navicon'); if(ci) ci.classList.add('bump'); }
  window._lc = cnt;
  $('nav').querySelectorAll('.navitem').forEach(n => n.onclick = () => { S.tab = n.dataset.tab; S.img = null; S.edit = null; S.sel = null; renderNav(); renderTab(); });
}

// ---- Yordamchilar ----
const media = p => p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}">` : ICON;
const disc = p => p.oldPrice && p.oldPrice > p.price;
const priceHtml = p => `<div class="price">${disc(p) ? `<span class="oldprice">${fmt(p.oldPrice)}</span>` : ''}${fmt(p.price)}</div>`;
function stars(avg, n){
  const f = Math.round(avg || 0); let s = '';
  for(let i=1;i<=5;i++) s += `<span style="color:${i<=f?'#F5A623':'#DADEDA'}">★</span>`;
  return `<div style="font-size:11px;margin-bottom:4px">${s} <span style="color:var(--mut)">(${n||0})</span></div>`;
}
function delivery(p, mode){
  const r = p.deliveryRegions || [];
  if(!r.length) return "🚫 Yetkazib berish yo'q";
  const pr = p.deliveryPrice ? fmt(p.deliveryPrice) : 'Bepul';
  const all = r.includes('barchasi');
  const sc = mode==='full' ? (all ? 'Barcha viloyatlarga' : r.map(esc).join(', ')) : all ? 'Barcha viloyatlar' : `${r.length} ta hudud`;
  return `🚚 ${sc} · ${pr}`;
}
const dcolor = p => (p.deliveryRegions||[]).length ? 'var(--grn)' : 'var(--mut)';
function card(p, buyer){
  const low = p.stock > 0 && p.stock <= 5;
  return `<div class="pcard"><div class="pimg" data-detail="${p.id}">
    ${disc(p) ? `<div class="discbadge">−${Math.round((1-p.price/p.oldPrice)*100)}%</div>` : ''}
    ${p.onSale ? `<div class="salebadge">⏱ ${p.daysLeft} KUN</div>` : ''}
    ${(p.reviewCount >= 3 && p.avgRating >= 4.5) ? '<div class="newbadge top">⭐ Top</div>' : NEWIDS.has(p.id) ? '<div class="newbadge">✨ Yangi</div>' : ''}
    ${buyer ? `<button class="heartbtn" data-fav="${p.id}">${p.isFavorited?'❤️':'🤍'}</button>` : ''}${media(p)}</div>
    <div class="pbody"><span class="tag">${esc(p.cat)}</span>
    <div class="pname" data-detail="${p.id}">${esc(p.name)}</div>
    <div class="pseller" data-store="${p.sellerId}" style="cursor:pointer;text-decoration:underline">${esc(p.sellerName)}</div>
    ${stars(p.avgRating, p.reviewCount)}
    <div style="font-size:10px;color:${dcolor(p)};margin-bottom:3px">${delivery(p)}</div>${priceHtml(p)}
    <div style="font-size:10.5px;margin-bottom:6px" class="${low?'lowstock':''}">${p.stock>0 ? (low ? `⚡ Faqat ${p.stock} dona qoldi!` : `Omborda: ${p.stock} dona`) : '<span style="color:var(--red)">Tugagan</span>'}</div>
    <button class="addbtn" data-add="${p.id}" ${p.stock>0?'':'disabled'}>${p.stock>0 ? "Savatga qo'shish" : 'Tugagan'}</button></div></div>`;
}
function addToCart(p){
  const n = S.cart[p.id] || 0;
  if(n >= p.stock){ toast("Omborda shuncha bor: " + p.stock + " dona"); return; }
  S.cart[p.id] = n + 1; toast(`"${p.name}" savatga qo'shildi`); renderNav();
}
function wire(main, products, after){
  main.querySelectorAll('[data-add]').forEach(b => b.onclick = e => { e.stopPropagation(); const p = products.find(x => x.id == b.dataset.add); if(p) addToCart(p); });
  main.querySelectorAll('[data-fav]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    try {
      const { favorited } = await api('/api/favorites/toggle', { method:'POST', body:JSON.stringify({ productId:Number(b.dataset.fav) }) });
      b.textContent = favorited ? '❤️' : '🤍';
      toast(favorited ? "Sevimlilarga qo'shildi ❤️" : "Sevimlilardan olib tashlandi");
      if(after) after();
    } catch(e){ toast(e.message); }
  });
  main.querySelectorAll('[data-detail]').forEach(el => el.onclick = () => {
    const p = products.find(x => x.id == el.dataset.detail); if(!p) return;
    S.sel = p; S.prev = S.tab; S.tab = 'detail'; renderTab();
  });
  main.querySelectorAll('[data-store]').forEach(el => el.onclick = e => {
    e.stopPropagation(); S.sellerId = Number(el.dataset.store); S.prev = S.tab === 'detail' ? 'home' : S.tab; S.tab = 'store'; renderTab();
  });
}
const goBack = () => { S.tab = S.prev || 'home'; S.sel = null; renderNav(); renderTab(); };

const sellerPay = o => `<div class="oline" style="margin-top:6px"><span>To'lov</span><span>${payLabel(o)}</span></div>`

const chatBtn = id => `<button class="addbtn" style="background:var(--vl);color:var(--vt);margin-top:8px" data-chattoggle="${id}">💬 Xabarlar</button><div data-chatbox="${id}" style="display:none;margin-top:10px"></div>`;
function wireChat(main){
  main.querySelectorAll('[data-chattoggle]').forEach(b => b.onclick = async () => {
    const id = b.dataset.chattoggle, box = main.querySelector(`[data-chatbox="${id}"]`);
    if(box.style.display === 'none'){ box.style.display = 'block'; await loadChat(id, box); } else box.style.display = 'none';
  });

async function loadChat(id, box){
  box.innerHTML = '<div class="empty" style="padding:10px">Yuklanmoqda...</div>';
  try {
    const { messages } = await api('/api/orders/' + id + '/messages');
    box.innerHTML = `<div class="chatwrap">${messages.length ? messages.map(m => `<div class="chatmsg ${m.senderId===S.user.id?'mine':'theirs'}"><div class="who">${esc(m.senderName)}</div>${esc(m.text)}</div>`).join('') : '<div class="empty" style="padding:10px;font-size:11.5px">Hali xabar yo\'q</div>'}</div>
      <div class="chatinput"><input id="ci-${id}" placeholder="Xabar yozing..."><button id="cs-${id}">➤</button></div>`;
    const send = async () => {
      const inp = $('ci-' + id), text = inp.value.trim(); if(!text) return;
      try { await api('/api/orders/' + id + '/messages', { method:'POST', body:JSON.stringify({ text }) }); await loadChat(id, box); }
      catch(e){ toast(e.message); }
    };
    $('cs-' + id).onclick = send;
    $('ci-' + id).onkeydown = e => { if(e.key==='Enter') send(); };
  } catch(e){ box.innerHTML = `<div class="empty err" style="padding:10px">${esc(e.message)}</div>`; }
}

async function renderTab(silent){
  const main = $('main'); if(!main) return;
  if(silent !== true) main.innerHTML = (S.user && S.user.role==='buyer' && ['home','favorites','store'].includes(S.tab)) ? SKEL : '<div class="empty">Yuklanmoqda...</div>';
  try { await renderTabInner(main); }
  catch(e){
    main.innerHTML = `<div class="empty err">⚠️ ${esc(e.message)}<br><br><button class="addbtn" style="width:auto;padding:10px 20px" id="retryBtn">Qayta urinish</button></div>`;
    const r = $('retryBtn'); if(r) r.onclick = () => renderTab();
  }
}

async function renderTabInner(main){
  const seller = role()==='seller';
  // Profil bo'limlari barcha rollar uchun (tasdiqlanmagan sotuvchi ham chiqib keta olishi uchun)
  if(COMMON_PROFILE.includes(S.tab)) return renderProfilePage(main);
  if(role()==='admin') return renderAdmin(main);
  // Tasdiqlanmagan sotuvchi hech qaysi bo'limni ishlata olmaydi
  if(seller && (S.user.sellerStatus || 'faol') !== 'faol') return sellerPending(main);
  if(S.tab==='detail') return renderDetail(main);
  if(S.tab==='store') return renderStore(main);
  if(S.tab==='home') return seller ? sellerHome(main) : buyerHome(main);
  if(S.tab==='favorites' && !seller) return buyerFavs(main);
  if(S.tab==='cart' && !seller) return buyerCart(main);
  if(S.tab==='orders') return seller ? sellerOrders(main) : buyerOrders(main);
  if(S.tab==='add' && seller) return sellerAdd(main);
  if(S.tab==='account' && seller) return sellerAccount(main);
  if(S.tab==='pay' && seller) return sellerPayments(main);
  S.tab = 'home'; renderNav(); return renderTab();
}

// ---- Sotuvchi tasdiqlanishini kutish ----
async function refreshMe(manual){
  try {
    const { user } = await api('/api/me');
    const was = S.user.sellerStatus;
    S.user = user;
    if(user.sellerStatus !== was){
      if(user.sellerStatus === 'faol') toast('Hisobingiz tasdiqlandi ✅');
      renderApp();
    } else if(manual) toast(user.sellerStatus === 'faol' ? 'Hisobingiz faol' : 'Hali tasdiqlanmagan');
  } catch(e){ if(manual) toast(e.message); }
}
function sellerPending(main){
  const rej = S.user.sellerStatus === 'rad etildi';
  main.innerHTML = `<div class="empty" style="padding-top:50px">${rej
    ? "❌<br><br><b>Hisobingiz rad etilgan yoki bloklangan</b><br>Admin bilan bog'laning."
    : "⏳<br><br><b>Arizangiz ko'rib chiqilmoqda</b><br>Admin pasport va selfingizni tekshirgach, mahsulot qo'sha olasiz.<br>Tasdiqlansa shu yerda xabar chiqadi."}<br><br>
    <button class="addbtn" style="width:auto;padding:10px 20px" id="chkBtn">Tekshirish</button></div>`;
  $('chkBtn').onclick = () => refreshMe(true);
}
setInterval(() => {
  if(!S.user || S.user.role !== 'seller' || (S.user.sellerStatus || 'faol') === 'faol' || document.hidden) return;
  refreshMe(false);
}, 10000);

let adsCache = { t:0, data:null }, adTimer = null;
const adViewed = {};
async function loadAds(){
  const box = $('adBox'); if(!box) return;
  clearInterval(adTimer);
  let ads = null;
  try {
    if(adsCache.data && Date.now() - adsCache.t < 60000) ads = adsCache.data;
    else { ads = (await api('/api/ads')).ads || []; adsCache = { t:Date.now(), data:ads }; }
  } catch(e){ ads = null; }
  const b = $('adBox'); if(!b) return;
  if(ads === null){ b.innerHTML = ''; return; }
  if(!ads.length){
    b.innerHTML = `<div class="adslot"><div>📢 Bu yerda sizning reklamangiz bo'lishi mumkin<small>Reklama joylash uchun biz bilan bog'laning</small></div><button id="adContact">Bog'lanish</button></div>`;
    $('adContact').onclick = () => window.open(CONTACT_TG, '_blank');
    return;
  }
  b.innerHTML = `<div class="adwrap"><div class="adtrack" id="adTrack">${ads.map((a, i) => `<div class="adslide" data-i="${i}"><img src="${esc(a.image)}" alt="${esc(a.title)}"><span class="adtag">Reklama</span></div>`).join('')}</div>${ads.length > 1 ? `<div class="addots" id="adDots">${ads.map((a, i) => `<i class="${i===0?'on':''}"></i>`).join('')}</div>` : ''}</div>`;
  const tr = $('adTrack'), n = ads.length;
  let cur = 0, resume = null;
  const mark = i => {
    cur = i;
    document.querySelectorAll('#adDots i').forEach((d, k) => d.classList.toggle('on', k === i));
    const a = ads[i];
    if(a && !adViewed[a.id]){ adViewed[a.id] = 1; api('/api/ads/' + a.id + '/view', { method:'POST' }).catch(() => {}); }
  };
  const go = i => { const k = (i + n) % n; tr.scrollTo({ left:k * tr.clientWidth, behavior:'smooth' }); };
  const start = () => {
    clearInterval(adTimer);
    if(n > 1) adTimer = setInterval(() => { if(!$('adTrack')){ clearInterval(adTimer); return; } if(!document.hidden) go(cur + 1); }, 5000);
  };
  tr.addEventListener('scroll', () => { const i = Math.round(tr.scrollLeft / (tr.clientWidth || 1)); if(i !== cur && i >= 0 && i < n) mark(i); });
  tr.addEventListener('touchstart', () => { clearInterval(adTimer); clearTimeout(resume); }, { passive:true });
  tr.addEventListener('touchend', () => { clearTimeout(resume); resume = setTimeout(start, 6000); }, { passive:true });
  tr.addEventListener('click', e => {
    const s = e.target.closest('.adslide'); if(!s) return;
    const a = ads[Number(s.dataset.i)]; if(!a) return;
    api('/api/ads/' + a.id + '/click', { method:'POST' }).catch(() => {});
    if(a.link) window.open(a.link, '_blank');
  });
  mark(0); start();
}

async function buyerCart(main){

  if(!ids.length){ main.innerHTML = '<div class="empty"><div class="eico">🛒</div>Savatingiz bo\'sh<br><br><button class="addbtn" style="width:auto;padding:10px 20px" id="goShop">Xarid qilish</button></div>'; $('goShop').onclick = () => { S.tab = 'home'; renderNav(); renderTab(); }; return; }

    return `<div class="citem"><div><div class="cname">${esc(p.name)}</div><div class="cprice">${fmt(p.price)}</div></div><div class="qty"><button data-dec="${id}">−</button><span>${S.cart[id]}</span><button data-inc="${id}">+</button></div></div>`; }).join('');

    <div class="summary"><div class="sumrow"><span>Mahsulotlar</span><span>${fmt(total)}</span></div>
    <div class="sumrow"><span>Yetkazib berish</span><span id="dDisp">—</span></div>
    <div class="sumrow total"><span>Jami</span><span id="gDisp">${fmt(total)}</span></div>
    <div class="field" style="margin-top:10px"><label>To'lov usuli</label><select id="pm"><option value="naqd">💵 Naqd (yetkazishda)</option><option value="karta">💳 Karta orqali (sotuvchi kartasiga)</option></select></div>
    <div id="pmHint" style="font-size:11px;color:var(--mut);margin:-6px 0 8px;display:none">Buyurtmadan keyin Profil → «Buyurtmalarim» bo'limida sotuvchi kartasi ko'rinadi va chekni yuklaysiz.</div>
    <button class="checkout" id="checkoutBtn">Buyurtma berish</button></div>`;
  main.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => { const p = products.find(x => x.id == b.dataset.inc); if(p && S.cart[p.id] >= p.stock){ toast("Omborda shuncha bor: " + p.stock + " dona"); return; } S.cart[b.dataset.inc]++; renderTab(); renderNav(); });
  main.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => { S.cart[b.dataset.dec] = Math.max(0, S.cart[b.dataset.dec] - 1); renderTab(); renderNav(); });
  const calc = () => {
    const r = $('region').value, w = $('regionWarning');
    if(!r){ $('dDisp').textContent = '—'; $('gDisp').textContent = fmt(total); w.style.display = 'none'; return null; }
    let d = 0; const bad = [];
    ids.forEach(id => { const p = products.find(x => x.id == id), rg = p.deliveryRegions || []; if(rg.includes('barchasi') || rg.includes(r)) d += p.deliveryPrice || 0; else bad.push(p.name); });
    w.style.display = bad.length ? 'block' : 'none';
    if(bad.length) w.textContent = `⚠️ Quyidagilar "${r}"ga yetkazilmaydi: ${bad.join(', ')}`;
    $('dDisp').textContent = fmt(d); $('gDisp').textContent = fmt(total + d);
    return { bad };
  };
  $('region').onchange = calc; if(reg) calc();
  $('pm').onchange = () => { $('pmHint').style.display = $('pm').value==='karta' ? 'block' : 'none'; };
  $('checkoutBtn').onclick = async () => {
    const address = $('addr').value.trim(), region = $('region').value, paymentMethod = $('pm').value;
    if(!region){ toast('Viloyatni tanlang'); return; }
    if(!address){ toast('Manzilni kiriting'); return; }
    const c = calc(); if(c && c.bad.length){ toast("Ba'zi mahsulotlar shu hududga yetkazilmaydi"); return; }
    $('checkoutBtn').disabled = true;
    try {
      await api('/api/orders', { method:'POST', body:JSON.stringify({ items:ids.map(id => ({ productId:Number(id), qty:S.cart[id] })), address, region, paymentMethod }) });
      localStorage.setItem('savdouz_addr', address); localStorage.setItem('savdouz_region', region);
      S.cart = {}; toast(paymentMethod==='karta' ? "Qabul qilindi! «Buyurtmalarim»da chekni yuklang 🧾" : 'Buyurtma qabul qilindi! ✅');
      S.tab = 'orders'; renderNav(); renderTab();
    } catch(e){ toast(e.message); $('checkoutBtn').disabled = false; }
  };
}

async function buyerOrders(main){

    ${needRcpt ? `<div class="summary" style="margin:10px 0 0;background:var(--vl)">
      <div style="font-size:11.5px;color:var(--mut);margin-bottom:6px">${fmt(o.total)} ni sotuvchi kartasiga o'tkazing:</div>
      ${(o.sellers||[]).map(s => `<div style="margin-bottom:6px"><div style="font-weight:800;font-size:14px;color:var(--vt)">${s.card ? esc(s.card.number) : "Karta kiritilmagan"}</div><div style="font-size:11px;color:var(--mut)">${esc(s.name)}${s.card ? ' · ' + esc(s.card.holder) : ''} · ${esc(s.phone)}</div></div>`).join('')}

    ${canRecv ? `<button class="checkout" style="margin-top:10px" data-recv="${o.id}">✅ Mahsulotni oldim</button>` : ''}
    ${chatBtn(o.id)}</div>`; }).join('');
  subBack(main, 'Buyurtmalarim');
  main.querySelectorAll('.rate-row').forEach(row => {
    const st = row.querySelectorAll('.starbtn');
    st.forEach(s => s.onclick = async () => {
      const n = Number(s.dataset.star);
      st.forEach((x, i) => x.style.color = i < n ? '#F5A623' : '#DADEDA');
      try { await api('/api/products/' + row.dataset.pid + '/reviews', { method:'POST', body:JSON.stringify({ rating:n, comment:'' }) }); toast(`"${row.dataset.pname}" uchun ${n} yulduz ✅`); }
      catch(e){ toast(e.message); }
    });
  });
  main.querySelectorAll('[data-rfile]').forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    try {
      toast('Chek yuborilmoqda...');
      const image = await readImage(f);
      await api('/api/orders/' + inp.dataset.rfile + '/receipt', { method:'POST', body:JSON.stringify({ image }) });
      toast('Chek yuborildi, sotuvchi tasdiqlaydi ✅'); renderTab();
    } catch(e){ toast(e.message); }
  });
  main.querySelectorAll('[data-recv]').forEach(b => b.onclick = async () => {
    if(!b.dataset.sure){
      b.dataset.sure = '1'; b.textContent = 'Tasdiqlash uchun yana bosing';
      setTimeout(() => { if(b.isConnected){ b.dataset.sure = ''; b.textContent = '✅ Mahsulotni oldim'; } }, 4000);
      return;

    b.disabled = true;

    catch(e){ toast(e.message); b.disabled = false; }
  });
  wirePay(main, () => {});
  wireChat(main);
}

// ---- Telefondagi "Orqaga" tugmasi ----
// Ilova ichida bosilsa: ochiq sahifadan bir qadam orqaga qaytadi.
// Bosh sahifada birinchi bosish ogohlantiradi, 2 soniya ichida ikkinchi bosish ilovani yopadi.
let guard = false, exitArmed = false, exitTimer = null;
const homeTab = () => (S.user && role()==='admin') ? 'sellers' : 'home';
function parentTab(){
  const t = S.tab;
  if(t==='detail' || t==='store') return S.prev && S.prev!==t ? S.prev : homeTab();
  if(['settings','notifs','help','contact','account','ads'].includes(t)) return 'profile';
  if(t==='orders' && S.user && role()==='buyer') return 'profile';
  return homeTab();
}
function pushGuard(){
  if(guard || !S.user) return;
  // Brauzer foydalanuvchi bosmasdan qo'shilgan yozuvni o'tkazib yuboradi, shuning uchun faqat bosishdan keyin qo'shamiz
  if(navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
  try { history.pushState({ sv:1 }, ''); guard = true; } catch(e){}
}
document.addEventListener('click', () => { exitArmed = false; clearTimeout(exitTimer); pushGuard(); }, true);
window.addEventListener('popstate', () => {
  guard = false;
  if(!S.user) return;
  if(S.tab !== homeTab()){
    const from = S.tab;
    S.tab = parentTab();
    if(from==='detail' || from==='store') S.sel = null;
    S.img = null; S.edit = null;
    renderNav(); renderTab(); pushGuard();
    return;
  }
  // Bosh sahifada: ikkinchi marta bosilsa tizim ilovani yopadi
  if(exitArmed) return;
  exitArmed = true;
  toast('Chiqish uchun yana bir marta bosing');
  clearTimeout(exitTimer);
  exitTimer = setTimeout(() => { exitArmed = false; pushGuard(); }, 2200);
});

// ---- Ovozli bildirishnoma ----
let _ac = null;
function unlockSound(){ try { if(!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)(); if(_ac.state === 'suspended') _ac.resume(); } catch(e){} }
['click','touchstart','keydown'].forEach(ev => document.addEventListener(ev, unlockSound, { passive:true }));
function beep(kind){
  try {
    unlockSound(); if(!_ac) return;
    const notes = kind === 'money' ? [660, 880, 1100] : [880, 660, 880, 660];
    notes.forEach((f, i) => {
      const o = _ac.createOscillator(), g = _ac.createGain(), t = _ac.currentTime + i * 0.22;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.4, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(_ac.destination); o.start(t); o.stop(t + 0.22);
    });
    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch(e){}
}
let _snd = { key:null, ord:null, bal:null, pay:null, pend:null };
const _maxId = a => (a || []).reduce((m, x) => x.id > m ? x.id : m, 0);
setInterval(async () => {
  if(!S.user || !S.token){ _snd = { key:null, ord:null, bal:null, pay:null, pend:null }; return; }
  const key = S.token + ':' + S.user.role;
  if(_snd.key !== key) _snd = { key, ord:null, bal:null, pay:null, pend:null };
  try {
    if(S.user.role === 'seller'){
      const o = await api('/api/orders/incoming'); const m = _maxId(o.orders);
      if(_snd.ord !== null && m > _snd.ord) beep('order');
      _snd.ord = m;
      const a = await api('/api/account'); const b = a.balance || 0;
      if(_snd.bal !== null && b > _snd.bal) beep('money');
      _snd.bal = b;
    } else if(S.user.role === 'admin'){
      const p = await api('/api/admin/payments'); const m = _maxId(p.payments);
      if(_snd.pay !== null && m > _snd.pay) beep('money');
      _snd.pay = m;
      // Yangi sotuvchi tasdiqlashni kutsa ovoz chiqadi va "Sotuvchilar" belgisi yangilanadi
      const pd = await api('/api/admin/pending');
      if(_snd.pend !== null && pd.count > _snd.pend) beep('order');
      _snd.pend = pd.count;
      if(S.pend !== pd.count){ S.pend = pd.count; if($('nav')) renderNav(); }
    }
  } catch(e){}
}, 8000);

  catch(e){
    if(!S.token) return;
    $('app').innerHTML = `<div class="empty err" style="margin:auto">⚠️ ${esc(e.message)}<br><br><button class="addbtn" style="width:auto;padding:10px 20px" id="retryInit">Qayta urinish</button> <button class="addbtn" style="width:auto;padding:10px 20px;background:var(--mut)" id="outInit">Chiqish</button></div>`;
    $('retryInit').onclick = init; $('outInit').onclick = () => logout(false);
  }
})();
</script>
<script src="/docs.js"></script>
</body>
</html>
