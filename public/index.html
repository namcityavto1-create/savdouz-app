<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SavdoUz</title>
<style>
:root{
  --ink:#150F2E; --violet:#6C4BF4; --violet-dk:#4E2FD9; --violet-lt:#F1EDFE;
  --bg:#F5F4FA; --card:#FFFFFF; --muted:#8A8497; --line:#ECE9F5; --red:#F23557;
  --orange:#FF6B35;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;}
.app{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
svg{display:block;}
input,select,textarea{font-family:inherit;font-size:14px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);width:100%;background:#fff;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);}
button{font-family:inherit;cursor:pointer;transition:transform .1s,opacity .15s;}
button:active{transform:scale(.97);}
label{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block;}
.field{margin-bottom:13px;}
.authwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;}
.authlogo{width:66px;height:66px;border-radius:22px;background:linear-gradient(150deg,var(--violet),var(--violet-dk));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:30px;margin:0 auto 18px;
  box-shadow:0 10px 24px -6px rgba(108,75,244,.45);}
.authtitle{text-align:center;font-size:23px;font-weight:800;margin-bottom:4px;letter-spacing:-.3px;}
.authsub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:28px;}
.roletabs{display:flex;background:var(--violet-lt);border-radius:14px;padding:4px;margin-bottom:16px;}
.roletab{flex:1;text-align:center;padding:9px 0;font-size:13px;border-radius:11px;font-weight:700;color:var(--violet-dk);opacity:.55;cursor:pointer;}
.roletab.active{background:#fff;opacity:1;box-shadow:0 2px 8px rgba(108,75,244,.15);}
.primarybtn{width:100%;background:linear-gradient(135deg,var(--violet),var(--violet-dk));color:#fff;border:none;border-radius:16px;padding:15px;font-weight:800;font-size:14.5px;margin-top:6px;box-shadow:0 8px 18px -6px rgba(108,75,244,.5);}
.switchmode{text-align:center;margin-top:18px;font-size:13px;color:var(--muted);}
.switchmode b{color:var(--violet-dk);cursor:pointer;}
.errmsg{background:#FEECEF;color:var(--red);font-size:12.5px;padding:10px 13px;border-radius:12px;margin-bottom:12px;display:none;font-weight:600;}
header{background:linear-gradient(135deg,var(--violet),var(--violet-dk));padding:16px 18px 18px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 22px 22px;box-shadow:0 6px 20px -8px rgba(108,75,244,.5);}
.brandrow{display:flex;gap:10px;align-items:center;} .logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;}
.brandtext .name{font-size:17px;font-weight:800;color:#fff;}
.brandtext .tag{font-size:10.5px;color:rgba(255,255,255,.78);}
.logoutbtn{background:rgba(255,255,255,.18);border:none;border-radius:11px;padding:8px 13px;font-size:11.5px;color:#fff;font-weight:700;}
main{flex:1;padding:16px 16px 92px;}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.sectitle{font-size:17px;font-weight:800;letter-spacing:-.2px;}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:4px;}
.cat{flex:0 0 auto;padding:8px 15px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);font-size:12.5px;font-weight:600;cursor:pointer;}
.cat.active{background:var(--violet);color:#fff;border-color:var(--violet);box-shadow:0 6px 14px -6px rgba(108,75,244,.6);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pcard{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 4px 16px -6px rgba(21,15,46,.1);}
.pimg{height:110px;background:var(--violet-lt);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.pimg svg{width:44px;height:44px;}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;}
.pbody{padding:11px 12px 13px;}
.tag{display:inline-block;background:var(--violet-lt);color:var(--violet-dk);font-size:9.5px;font-weight:800;padding:4px 8px;border-radius:8px;margin-bottom:6px;}
.pname{font-size:13px;font-weight:700;line-height:1.25;margin-bottom:2px;}
.pseller{font-size:10.5px;color:var(--muted);margin-bottom:5px;}
.price{font-weight:800;color:var(--ink);font-size:15px;margin-bottom:8px;}
.addbtn{width:100%;background:linear-gradient(135deg,var(--violet),var(--violet-dk));color:#fff;border:none;border-radius:13px;padding:9px 0;font-size:11.5px;font-weight:800;box-shadow:0 6px 14px -6px rgba(108,75,244,.5);}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:60px 20px;line-height:1.6;}
.citem,.oitem{background:var(--card);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 3px 12px -6px rgba(21,15,46,.09);}
.citem{display:flex;justify-content:space-between;align-items:center;}
.cname{font-size:13px;font-weight:700;}
.cprice{font-size:12px;color:var(--violet-dk);font-weight:800;margin-top:2px;}
.qty{display:flex;align-items:center;gap:10px;}
.qty button{width:27px;height:27px;border-radius:9px;border:none;background:var(--violet-lt);color:var(--violet-dk);font-size:15px;font-weight:800;}
.summary{background:var(--card);border-radius:18px;padding:16px;margin-top:6px;box-shadow:0 3px 12px -6px rgba(21,15,46,.09);}
.sumrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:var(--muted);}
.sumrow.total{font-weight:800;font-size:16px;margin-top:6px;color:var(--ink);}
.checkout{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--violet),var(--violet-dk));color:#fff;border:none;border-radius:15px;padding:14px;font-weight:800;font-size:14.5px;box-shadow:0 8px 18px -6px rgba(108,75,244,.5);}
.oitem .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:7px;}
.status{display:inline-block;padding:4px 10px;border-radius:9px;font-size:10.5px;font-weight:800;background:var(--violet-lt);color:var(--violet-dk);}
.oline{font-size:12.5px;display:flex;justify-content:space-between;margin-top:4px;}
.ototal{font-weight:800;margin-top:9px;padding-top:9px;border-top:1.5px dashed var(--line);display:flex;justify-content:space-between;}
select.statusSel{margin-top:9px;font-size:12px;padding:9px 11px;}
.addform{background:var(--card);border-radius:18px;padding:17px;margin-bottom:16px;box-shadow:0 3px 12px -6px rgba(21,15,46,.09);}
.imgpreview{width:100%;height:140px;border-radius:15px;background:var(--violet-lt);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;border:1.5px dashed #D7CCFB;}
.imgpreview img{width:100%;height:100%;object-fit:cover;}
.imgpreview span{font-size:12px;color:var(--muted);}
nav{position:fixed;bottom:12px;left:12px;right:12px;background:#fff;border-radius:22px;max-width:396px;margin:0 auto;display:flex;box-shadow:0 10px 30px -8px rgba(21,15,46,.25);padding:4px;}
.navitem{flex:1;text-align:center;padding:9px 0 7px;font-size:10px;color:var(--muted);cursor:pointer;border-radius:18px;font-weight:600;}
.navitem.active{color:var(--violet-dk);font-weight:800;background:var(--violet-lt);}
.navicon{margin-bottom:2px;display:flex;justify-content:center;font-size:17px;}
.navicon svg{width:19px;height:19px;}
.badge{position:relative;top:-16px;left:10px;background:var(--red);color:#fff;font-size:9.5px;border-radius:9px;min-width:15px;height:15px;line-height:15px;padding:0 3px;font-weight:700;}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;opacity:0;transition:all .25s;z-index:20;max-width:380px;text-align:center;box-shadow:0 8px 22px -6px rgba(0,0,0,.35);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API = '';
let state = { token: localStorage.getItem('savdouz_token') || null, user: null, tab: 'home', cat: 'Barchasi', cart: {}, pendingImage: null, editingProduct: null };
const ICONS = {
  phone:'<svg viewBox="0 0 24 24"><rect x="6" y="1.5" width="12" height="21" rx="2.3" fill="#2B3543"/><rect x="7.2" y="3.3" width="9.6" height="15.5" rx="0.6" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1868E0"/><stop offset="1" stop-color="#7BB3FF"/></linearGradient></defs></svg>',
  shirt:'<svg viewBox="0 0 24 24"><path d="M16 4l4.2 2-2.3 4.3-1.9-.9V20a1 1 0 01-1 1H9a1 1 0 01-1-1V9.4l-1.9.9L3.8 6 8 4l2 2h4z" fill="#3B82F6"/></svg>',
  car:'<svg viewBox="0 0 24 24"><rect x="2.5" y="13" width="19" height="6" rx="2" fill="#E14848"/><rect x="6" y="8.2" width="12" height="4.6" rx="1" fill="#8FC5FF"/><circle cx="7" cy="19" r="1.8" fill="#2B3543"/><circle cx="17" cy="19" r="1.8" fill="#2B3543"/></svg>',
  sofa:'<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="7" rx="2" fill="#8FA6C2"/><rect x="2" y="14" width="3" height="6" rx="1.3" fill="#5B7396"/><rect x="19" y="14" width="3" height="6" rx="1.3" fill="#5B7396"/><rect x="5.5" y="12.5" width="5.2" height="4" rx="1" fill="#1868E0"/><rect x="13.3" y="12.5" width="5.2" height="4" rx="1" fill="#1868E0"/></svg>',
  laptop:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="10.5" rx="1.2" fill="#2B3543"/><rect x="5.1" y="5.1" width="13.8" height="8.3" fill="#1868E0"/><path d="M2 17.5h20l-1.6-2.5H3.6z" fill="#8892A0"/></svg>',
};
const CATS = ["Barchasi","Telefon","Kiyim","Uy-ro'zg'or","Avto","Boshqa"];
const REGIONS = [
  "Toshkent shahri", "Toshkent viloyati", "Andijon", "Farg'ona", "Namangan",
  "Buxoro", "Jizzax", "Qashqadaryo", "Navoiy", "Samarqand",
  "Sirdaryo", "Surxondaryo", "Xorazm", "Qoraqalpog'iston"
];
const fmt = n => Number(n).toLocaleString('ru-RU') + " so'm";

function pimgHtml(p){
  if(p.image){ return `<img src="${p.image}" alt="${p.name}">`; }
  return ICONS[p.icon] || ICONS.laptop;
}

function readImageAsBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("Rasmni o'qib bo'lmadi"));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("Rasm formatini aniqlab bo'lmadi"));
      img.onload = ()=>{
        const maxSize = 700;
        let { width, height } = img;
        if(width > height && width > maxSize){ height = Math.round(height*maxSize/width); width = maxSize; }
        else if(height > maxSize){ width = Math.round(width*maxSize/height); height = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function api(path, opts={}){
  const headers = { 'Content-Type':'application/json' };
  if(state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Xato yuz berdi');
  return data;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(()=>t.classList.remove('show'), 2000);
}

let authMode = 'login'; let authRole = 'buyer';
function renderAuth(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="authwrap">
      <div class="authlogo">S</div>
      <div class="authtitle">SavdoUz</div>
      <div class="authsub">${authMode==='login' ? "Hisobingizga kiring" : "Yangi hisob yarating"}</div>
      <div class="errmsg" id="errmsg"></div>
      ${authMode==='register' ? `
      <div class="roletabs">
        <div class="roletab ${authRole==='buyer'?'active':''}" data-role="buyer">Xaridor</div>
        <div class="roletab ${authRole==='seller'?'active':''}" data-role="seller">Sotuvchi</div>
      </div>` : ''}
      ${authMode==='register' ? `<div class="field"><label>Ism</label><input id="fname" placeholder="Ismingiz"></div>` : ''}
      <div class="field"><label>Telefon raqam</label><input id="fphone" placeholder="+998901234567"></div>
      <div class="field"><label>Parol</label><input id="fpass" type="password" placeholder="••••••••"></div>
      <button class="primarybtn" id="submitBtn">${authMode==='login' ? 'Kirish' : "Ro'yxatdan o'tish"}</button>
      <div class="switchmode">
        ${authMode==='login' ? `Hisobingiz yo'qmi? <b id="toRegister">Ro'yxatdan o'ting</b>`
                              : `Hisobingiz bormi? <b id="toLogin">Kiring</b>`}
      </div>
    </div>`;
  app.querySelectorAll('.roletab').forEach(r=>r.onclick=()=>{authRole=r.dataset.role;renderAuth();});
  const toReg = document.getElementById('toRegister'); if(toReg) toReg.onclick=()=>{authMode='register';renderAuth();};
  const toLog = document.getElementById('toLogin'); if(toLog) toLog.onclick=()=>{authMode='login';renderAuth();};
  document.getElementById('submitBtn').onclick = submitAuth;
}
async function submitAuth(){
  const errEl = document.getElementById('errmsg');
  errEl.style.display='none';
  const phone = document.getElementById('fphone').value.trim();
  const password = document.getElementById('fpass').value;
  try{
    let data;
    if(authMode==='login'){
      data = await api('/api/login', { method:'POST', body: JSON.stringify({ phone, password }) });
    } else {
      const name = document.getElementById('fname').value.trim();
      if(!name) throw new Error('Ismingizni kiriting');
      data = await api('/api/register', { method:'POST', body: JSON.stringify({ name, phone, password, role: authRole }) });
    }
    state.token = data.token; state.user = data.user;
    localStorage.setItem('savdouz_token', state.token);
    state.tab = 'home';
    renderApp();
  } catch(e){
    errEl.textContent = e.message; errEl.style.display='block';
  }
}

async function renderApp(){
  const app = document.getElementById('app');
  const isSeller = state.user.role === 'seller';
  const isAdmin = state.user.role === 'admin';
  app.innerHTML = `
    <header>
      <div class="brandrow">
        <div class="logo">S</div>
        <div class="brandtext"><div class="name">SavdoUz</div><div class="tag">${state.user.name} · ${isAdmin?'Admin':(isSeller?'Sotuvchi':'Xaridor')}</div></div>
      </div>
      <button class="logoutbtn" id="logoutBtn">Chiqish</button>
    </header>
    <main id="main"></main>
    <nav id="nav"></nav>`;
  document.getElementById('logoutBtn').onclick = ()=>{
    localStorage.removeItem('savdouz_token'); state = { token:null,user:null,tab:'home',cat:'Barchasi',cart:{},pendingImage:null,editingProduct:null }; renderAuth();
  };
  if(isAdmin) state.tab = ['sellers','products','buyers','orders','payments'].includes(state.tab) ? state.tab : 'sellers';
  renderNav();
  await renderTab();
}

function renderNav(){
  const isSeller = state.user.role === 'seller';
  const isAdmin = state.user.role === 'admin';
  const nav = document.getElementById('nav');
  const cartCount = Object.values(state.cart).reduce((a,b)=>a+b,0);
  const items = isAdmin ? [
    ['sellers','🏪','Sotuvchilar'],['products','📦','Mahsulotlar'],['buyers','👤','Xaridorlar'],['orders','🧾','Buyurtmalar'],['payments','💳',"To'lovlar"]
  ] : isSeller ? [
    ['home','🏠','Mahsulotlarim'],['add','➕',"Qo'shish"],['orders','📦','Buyurtmalar']
  ] : [
    ['home','🏠','Bosh sahifa'],['cart','🛒','Savat'],['orders','📦','Buyurtmalarim']
  ];
  nav.innerHTML = items.map(([k,icon,label])=>`
    <div class="navitem ${state.tab===k?'active':''}" data-tab="${k}">
      <div class="navicon">${icon}</div>${label}${k==='cart'&&cartCount>0?`<span class="badge">${cartCount}</span>`:''}
    </div>`).join('');
  nav.querySelectorAll('.navitem').forEach(n=>n.onclick=async()=>{ state.tab=n.dataset.tab; state.pendingImage=null; state.editingProduct=null; renderNav(); await renderTab(); });
}

function starsHtml(avg, count){
  const full = Math.round(avg);
  let s = '';
  for(let i=1;i<=5;i++){ s += `<span style="color:${i<=full?'#F5A623':'#DADEDA'}">★</span>`; }
  return `<div style="font-size:11px;margin-bottom:4px">${s} <span style="color:var(--muted)">(${count||0})</span></div>`;
}

function deliveryLabel(p, mode){
  const regions = p.deliveryRegions || [];
  if(regions.length===0) return "🚫 Yetkazib berish yo'q";
  const price = p.deliveryPrice ? fmt(p.deliveryPrice) : "Bepul";
  if(mode==='full'){
    const scope = regions.includes('barchasi') ? "Barcha viloyatlarga" : regions.join(', ');
    return `🚚 ${scope} · ${price}`;
  }
  const scope = regions.includes('barchasi') ? "Barcha viloyatlar" : (mode==='short' ? `${regions.length} ta hudud` : `${regions.length} ta hududga`);
  return `🚚 ${scope} · ${price}`;
}

async function renderTab(){
  const main = document.getElementById('main');
  const isSeller = state.user.role === 'seller';
  const isAdmin = state.user.role === 'admin';
  main.innerHTML = `<div class="empty">Yuklanmoqda...</div>`;

  if(isAdmin){ await renderAdminTab(main); return; }

  if(state.tab==='home' && !isSeller){
    const { products } = await api('/api/products');
    const list = state.cat==='Barchasi' ? products : products.filter(p=>p.cat===state.cat);
    main.innerHTML = `
      <div class="cats">${CATS.map(c=>`<div class="cat ${c===state.cat?'active':''}" data-cat="${c}">${c}</div>`).join('')}</div>
      <div class="sechead"><div class="sectitle">Mahsulotlar</div></div>
      <div class="grid">${list.length ? list.map(p=>`
        <div class="pcard">
          <div class="pimg">${pimgHtml(p)}</div>
          <div class="pbody">
            <span class="tag">${p.cat}</span>
            <div class="pname">${p.name}</div>
            <div class="pseller">${p.sellerName}</div>
            ${starsHtml(p.avgRating, p.reviewCount)}
            <div style="font-size:10px;color:${(p.deliveryRegions||[]).length>0?'#1E7E34':'var(--muted)'};margin-bottom:3px">${deliveryLabel(p)}</div>
            <div class="price">${fmt(p.price)}</div>
            <div style="font-size:10.5px;color:${p.stock>0?'var(--muted)':'var(--red)'};margin-bottom:6px">${p.stock>0 ? `Omborda: ${p.stock} dona` : "Tugagan"}</div>
            <button class="addbtn" data-add="${p.id}" ${p.stock>0?'':'disabled style="opacity:.5"'}>${p.stock>0?"Savatga qo'shish":"Tugagan"}</button>
          </div>
        </div>`).join('') : `<div class="empty" style="grid-column:1/-1">Hozircha bu kategoriyada mahsulot yo'q</div>`}
      </div>`;
    main.querySelectorAll('.cat').forEach(c=>c.onclick=async()=>{state.cat=c.dataset.cat; await renderTab();});
    main.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.add;
      const p = products.find(pp=>pp.id==id);
      const inCart = state.cart[id]||0;
      if(inCart >= p.stock){ showToast("Omborda shuncha bor: "+p.stock+" dona"); return; }
      state.cart[id]=inCart+1;
      showToast(`"${p.name}" savatga qo'shildi`); renderNav();
    });
  }

  else if(state.tab==='cart' && !isSeller){
    const { products } = await api('/api/products');
    const ids = Object.keys(state.cart).filter(id=>state.cart[id]>0);
    if(!ids.length){ main.innerHTML = `<div class="empty">🛒<br><br>Savatingiz bo'sh</div>`; return; }
    let total = 0;
    const rows = ids.map(id=>{
      const p = products.find(pp=>pp.id==id); if(!p) return '';
      total += p.price*state.cart[id];
      return `<div class="citem">
        <div><div class="cname">${p.name}</div><div class="cprice">${fmt(p.price)}</div></div>
        <div class="qty"><button data-dec="${id}">−</button><span>${state.cart[id]}</span><button data-inc="${id}">+</button></div>
      </div>`;
    }).join('');
    main.innerHTML = `<div class="sectitle" style="margin-bottom:12px">Savat</div>${rows}
      <div class="field" style="margin-top:14px"><label>Yetkazib berish viloyati</label>
        <select id="region"><option value="">Viloyatni tanlang</option>${REGIONS.map(r=>`<option>${r}</option>`).join('')}</select>
      </div>
      <div id="regionWarning" style="display:none;background:#FDEDED;color:var(--red);font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:10px"></div>
      <div class="field"><label>Yetkazib berish manzili</label><input id="addr" placeholder="Shahar, ko'cha, uy"></div>
      <div class="summary">
        <div class="sumrow"><span>Mahsulotlar</span><span id="itemsTotalDisp">${fmt(total)}</span></div>
        <div class="sumrow"><span>Yetkazib berish</span><span id="deliveryTotalDisp">—</span></div>
        <div class="sumrow total"><span>Jami</span><span id="grandTotalDisp">${fmt(total)}</span></div>
        <div class="sumrow" style="margin-top:4px">To'lov: naqd/yetkazishda</div>
        <button class="checkout" id="checkoutBtn">Buyurtma berish</button>
      </div>`;
    main.querySelectorAll('[data-inc]').forEach(b=>b.onclick=async()=>{
      const pid=b.dataset.inc; const p=products.find(pp=>pp.id==pid);
      if(p && state.cart[pid]>=p.stock){ showToast("Omborda shuncha bor: "+p.stock+" dona"); return; }
      state.cart[pid]++; await renderTab(); renderNav();
    });
    main.querySelectorAll('[data-dec]').forEach(b=>b.onclick=async()=>{state.cart[b.dataset.dec]=Math.max(0,state.cart[b.dataset.dec]-1);await renderTab();renderNav();});
    function recalcDelivery(){
      const region = document.getElementById('region').value;
      const warnEl = document.getElementById('regionWarning');
      if(!region){
        document.getElementById('deliveryTotalDisp').textContent = '—';
        document.getElementById('grandTotalDisp').textContent = fmt(total);
        warnEl.style.display = 'none';
        return null;
      }
      let deliveryTotal = 0;
      const bad = [];
      ids.forEach(id=>{
        const p = products.find(pp=>pp.id==id); if(!p) return;
        const regions = p.deliveryRegions || [];
        const ok = regions.includes('barchasi') || regions.includes(region);
        if(!ok) bad.push(p.name); else deliveryTotal += (p.deliveryPrice||0);
      });
      if(bad.length){
        warnEl.style.display = 'block';
        warnEl.textContent = `⚠️ Quyidagi mahsulotlar "${region}"ga yetkazilmaydi: ${bad.join(', ')}`;
      } else {
        warnEl.style.display = 'none';
      }
      document.getElementById('deliveryTotalDisp').textContent = fmt(deliveryTotal);
      document.getElementById('grandTotalDisp').textContent = fmt(total + deliveryTotal);
      return { deliveryTotal, bad };
    }
    document.getElementById('region').onchange = recalcDelivery;
    document.getElementById('checkoutBtn').onclick = async ()=>{
      const address = document.getElementById('addr').value.trim();
      const region = document.getElementById('region').value;
      if(!region){ showToast("Yetkazib berish viloyatini tanlang"); return; }
      if(!address){ showToast("Manzilni kiriting"); return; }
      const calc = recalcDelivery();
      if(calc && calc.bad.length){ showToast("Ba'zi mahsulotlar shu hududga yetkazilmaydi"); return; }
      const items = ids.map(id=>({ productId:Number(id), qty:state.cart[id] }));
      try{
        await api('/api/orders', { method:'POST', body: JSON.stringify({ items, address, region }) });
        state.cart = {}; renderNav(); showToast("Buyurtma qabul qilindi! ✅"); state.tab='orders'; renderNav(); await renderTab();
      } catch(e){ showToast(e.message); }
    };
  }

  else if(state.tab==='orders' && !isSeller){

    if(!orders.length){ main.innerHTML = `<div class="empty">📦<br><br>Hali buyurtmalar yo'q</div>`; return; }
    main.innerHTML = `<div class="sectitle" style="margin-bottom:12px">Buyurtmalarim</div>` + orders.map(o=>`
      <div class="oitem">
        <div class="top"><span>№${o.id} · ${new Date(o.createdAt).toLocaleDateString('uz')}</span><span class="status">${o.status}</span></div>
        ${o.region ? `<div style="font-size:11px;color:var(--muted);margin-bottom:4px">📍 ${o.region}${o.address?', '+o.address:''}</div>` : ''}

          <div class="oline"><span>${it.name} × ${it.qty}</span><span>${fmt(it.price*it.qty)}</span></div>
          <div class="rate-row" data-pid="${it.productId}" data-pname="${it.name.replace(/"/g,'&quot;')}" style="display:flex;align-items:center;gap:4px;margin:2px 0 6px">
            ${[1,2,3,4,5].map(n=>`<span class="starbtn" data-star="${n}" style="cursor:pointer;color:#DADEDA;font-size:15px">★</span>`).join('')}
            <span style="font-size:10.5px;color:var(--muted);margin-left:4px">Baho qo'ying</span>
          </div>`).join('')}
        ${o.deliveryTotal ? `<div class="oline"><span>🚚 Yetkazib berish</span><span>${fmt(o.deliveryTotal)}</span></div>` : ''}
        <div class="ototal"><span>Jami</span><span>${fmt(o.total)}</span></div>
      </div>`).join('');
    main.querySelectorAll('.rate-row').forEach(row=>{
      const stars = row.querySelectorAll('.starbtn');
      stars.forEach(st=>st.onclick=async()=>{
        const n = Number(st.dataset.star);
        stars.forEach((s2,idx)=>{ s2.style.color = idx < n ? '#F5A623' : '#DADEDA'; });
        try{
          await api('/api/products/'+row.dataset.pid+'/reviews', { method:'POST', body: JSON.stringify({ rating: n, comment: '' }) });
          showToast(`"${row.dataset.pname}" uchun ${n} yulduz qo'yildi ✅`);
        } catch(e){ showToast(e.message); }
      });
    });
  }

  else if(state.tab==='home' && isSeller){
    const { products } = await api('/api/my-products');
    const earn = await api('/api/earnings');
    main.innerHTML = `<div class="sectitle" style="margin-bottom:12px">Mening mahsulotlarim</div>` +
      (earn.restricted ? `<div style="margin-bottom:12px;background:#FDEDED;color:var(--red);font-size:12px;padding:10px 12px;border-radius:10px;font-weight:600">⚠️ Qarzingiz limitdan (${fmt(earn.debtLimit)}) oshgan! Mahsulotlaringiz xaridorlarga ko'rinmayapti. "Buyurtmalar" bo'limidan to'lov yuboring.</div>` : '') +
      (products.length ? `<div class="grid">${products.map(p=>`
        <div class="pcard">
          <div class="pimg">${pimgHtml(p)}</div>
          <div class="pbody">
            <span class="tag">${p.cat}</span>
            <div class="pname">${p.name}</div>
            <div class="price">${fmt(p.price)}</div>
            <div style="font-size:10.5px;color:var(--muted);margin-bottom:2px">Omborda: ${p.stock} dona</div>
            <div style="font-size:10px;color:${(p.deliveryRegions||[]).length>0?'#1E7E34':'var(--muted)'};margin-bottom:6px;line-height:1.4">${deliveryLabel(p, 'full')}</div>
            <div style="display:flex;gap:6px">
              <button class="addbtn" style="background:var(--violet-dk)" data-edit="${p.id}">Tahrirlash</button>
              <button class="addbtn" style="background:var(--red)" data-del="${p.id}">O'chirish</button>
            </div>
          </div>
        </div>`).join('')}</div>` : `<div class="empty">Hali mahsulot qo'shmagansiz.<br>"Qo'shish" bo'limiga o'ting.</div>`);
    main.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm("Rostdan ham o'chirmoqchimisiz?")) return;
      await api('/api/products/'+b.dataset.del, { method:'DELETE' });
      showToast("Mahsulot o'chirildi"); await renderTab();
    });
    main.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{
      const p = products.find(pp=>pp.id==b.dataset.edit);
      state.editingProduct = p;
      state.pendingImage = p.image || null;
      state.tab = 'add'; renderNav(); await renderTab();
    });
  }

  else if(state.tab==='add' && isSeller){
    const ed = state.editingProduct;
    main.innerHTML = `<div class="sectitle" style="margin-bottom:12px">${ed ? "Mahsulotni tahrirlash" : "Yangi mahsulot"}</div>
      <div class="addform">
        <div class="field">
          <label>Mahsulot rasmi</label>
          <div class="imgpreview" id="imgPreview">${state.pendingImage ? `<img src="${state.pendingImage}">` : `<span>Rasm tanlanmagan</span>`}</div>
          <input id="pimageFile" type="file" accept="image/*">
        </div>
        <div class="field"><label>Nomi</label><input id="pname" placeholder="Masalan: Samsung Galaxy" value="${ed ? ed.name.replace(/"/g,'&quot;') : ''}"></div>
        <div class="field"><label>Kategoriya</label>
          <select id="pcat">${CATS.filter(c=>c!=='Barchasi').map(c=>`<option ${ed && ed.cat===c?'selected':''}>${c}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Narxi (so'm)</label><input id="pprice" type="number" placeholder="150000" value="${ed ? ed.price : ''}"></div>
        <div class="field"><label>Nechta bor (soni)</label><input id="pstock" type="number" placeholder="10" value="${ed ? ed.stock : ''}"></div>
        <div class="field"><label>Tavsif</label><textarea id="pdesc" rows="3" placeholder="Mahsulot haqida qisqacha">${ed ? (ed.desc||'') : ''}</textarea></div>
        <div class="field">
          <label>🚚 Yetkazib berish narxi (so'm)</label>
          <input id="pdeliveryprice" type="number" placeholder="Masalan: 15000" value="${ed ? (ed.deliveryPrice||0) : 0}">
        </div>
        <div class="field">
          <label>Qaysi hududlarga yetkazib berasiz?</label>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <input id="pdeliveryall" type="checkbox" style="width:auto" ${(!ed || (ed.deliveryRegions||['barchasi']).includes('barchasi')) ? 'checked' : ''}>
            <label style="margin:0" for="pdeliveryall">Barcha viloyatlar</label>
          </div>
          <div id="regionList" style="display:${(!ed || (ed.deliveryRegions||['barchasi']).includes('barchasi')) ? 'none' : 'grid'};grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:10px;padding:10px">
            ${REGIONS.map(r=>`
              <div style="display:flex;align-items:center;gap:6px">
                <input type="checkbox" class="regionChk" value="${r}" style="width:auto" ${ed && (ed.deliveryRegions||[]).includes(r) ? 'checked' : ''}>
                <label style="margin:0;font-size:12px;font-weight:400">${r}</label>
              </div>`).join('')}
          </div>
        </div>
        <button class="primarybtn" id="addProdBtn">${ed ? "Saqlash" : "Mahsulot qo'shish"}</button>
        ${ed ? `<button class="primarybtn" id="cancelEditBtn" style="background:var(--bg);color:var(--muted);margin-top:8px">Bekor qilish</button>` : ''}
      </div>`;
    document.getElementById('pimageFile').onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        showToast("Rasm tayyorlanmoqda...");
        const dataUrl = await readImageAsBase64(file);
        state.pendingImage = dataUrl;
        document.getElementById('imgPreview').innerHTML = `<img src="${dataUrl}">`;
      } catch(err){
        showToast("Rasmni yuklab bo'lmadi: " + err.message);
      }
    };
    document.getElementById('pdeliveryall').onchange = (e)=>{
      document.getElementById('regionList').style.display = e.target.checked ? 'none' : 'grid';
    };
    if(ed){
      document.getElementById('cancelEditBtn').onclick = async ()=>{
        state.editingProduct = null; state.pendingImage = null;
        state.tab='home'; renderNav(); await renderTab();
      };
    }
    document.getElementById('addProdBtn').onclick = async ()=>{
      const name = document.getElementById('pname').value.trim();
      const cat = document.getElementById('pcat').value;
      const price = document.getElementById('pprice').value;
      const stock = document.getElementById('pstock').value;
      const desc = document.getElementById('pdesc').value.trim();
      const deliveryPrice = document.getElementById('pdeliveryprice').value || 0;
      const allRegions = document.getElementById('pdeliveryall').checked;
      const deliveryRegions = allRegions ? ['barchasi'] : Array.from(document.querySelectorAll('.regionChk:checked')).map(c=>c.value);
      if(!name || !price){ showToast("Nom va narxni kiriting"); return; }
      if(!stock){ showToast("Nechta borligini kiriting"); return; }
      if(!allRegions && deliveryRegions.length===0){ showToast("Kamida bitta hududni tanlang yoki 'Barcha viloyatlar'ni belgilang"); return; }
      try{
        if(ed){
          await api('/api/products/'+ed.id, { method:'PATCH', body: JSON.stringify({ name, cat, price, desc, stock, image: state.pendingImage, deliveryRegions, deliveryPrice }) });
          showToast("Mahsulot yangilandi! ✅");
        } else {
          await api('/api/products', { method:'POST', body: JSON.stringify({ name, cat, price, desc, stock, image: state.pendingImage, deliveryRegions, deliveryPrice }) });
          showToast("Mahsulot qo'shildi! ✅");
        }
        state.pendingImage = null; state.editingProduct = null;
        state.tab='home'; renderNav(); await renderTab();
      } catch(e){ showToast(e.message); }
    };
  }

  else if(state.tab==='orders' && isSeller){
    const { orders } = await api('/api/orders/incoming');
    const earn = await api('/api/earnings');
    const { payments: myPayments } = await api('/api/payments/mine');
    const summary = `<div class="summary" style="margin-bottom:16px">
      <div class="sumrow"><span>Jami savdo</span><span>${fmt(earn.totalSales)}</span></div>
      <div class="sumrow"><span>Platforma komissiyasi (${(earn.commissionRate*100).toFixed(0)}%)</span><span>−${fmt(earn.totalCommission)}</span></div>
      <div class="sumrow"><span>To'langan komissiya</span><span>${fmt(earn.paidCommission)}</span></div>
      <div class="sumrow total" style="color:${earn.debt>0?'var(--red)':'var(--ink)'}"><span>${earn.debt>0?"Qarzingiz":"Qarzingiz yo'q"}</span><span>${fmt(Math.max(0,earn.debt))}</span></div>
      <div class="sumrow" style="margin-top:4px"><span>Ruxsat etilgan limit</span><span>${fmt(earn.debtLimit)}</span></div>
      ${earn.restricted ? `<div style="margin-top:10px;background:#FDEDED;color:var(--red);font-size:12px;padding:10px 12px;border-radius:10px;font-weight:600">⚠️ Qarzingiz limitdan oshgan! Mahsulotlaringiz xaridorlarga ko'rinmayapti. To'lov qilib, admin tasdiqlashi bilan qayta ochiladi.</div>` : ''}
      ${earn.payoutCard ? `
      <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Komissiyani shu kartaga o'tkazing:</div>
        <div style="display:flex;align-items:center;justify-content:space-between;background:var(--violet-lt);border-radius:10px;padding:10px 12px">
          <div>
            <div style="font-weight:800;font-size:14px;letter-spacing:0.5px;color:var(--violet-dk)">${earn.payoutCard.number}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${earn.payoutCard.name}</div>
          </div>
        </div>
      </div>` : ''}
    </div>
    <div class="addform" style="margin-bottom:16px">
      <div class="sectitle" style="margin-bottom:10px;font-size:14px">To'lov yuborish</div>
      <div class="field"><label>To'langan summa (so'm)</label><input id="payAmount" type="number" placeholder="Masalan: 50000"></div>
      <div class="field">
        <label>Chek yoki skrinshot</label>
        <div class="imgpreview" id="receiptPreview"><span>Rasm tanlanmagan</span></div>
        <input id="payReceipt" type="file" accept="image/*">
      </div>
      <button class="primarybtn" id="sendPaymentBtn">Yuborish</button>
    </div>
    ${myPayments.length ? `<div class="sectitle" style="margin-bottom:10px;font-size:14px">Mening to'lovlarim</div>` + myPayments.map(p=>`
      <div class="oitem">
        <div class="top"><span>${fmt(p.amount)} · ${new Date(p.createdAt).toLocaleDateString('uz')}</span>
        <span class="status" style="background:${p.status==='tasdiqlandi'?'#E6F4EA':p.status==='rad etildi'?'#FDEDED':'var(--violet-lt)'};color:${p.status==='tasdiqlandi'?'#1E7E34':p.status==='rad etildi'?'var(--red)':'var(--violet-dk)'}">${p.status}</span></div>
        ${p.adminNote ? `<div style="font-size:11.5px;color:var(--muted);margin-top:4px">Admin izohi: ${p.adminNote}</div>` : ''}
      </div>`).join('') : ''}`;
    document.getElementById('payReceipt').onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{
        showToast("Rasm tayyorlanmoqda...");
        const dataUrl = await readImageAsBase64(file);
        state.pendingReceipt = dataUrl;
        document.getElementById('receiptPreview').innerHTML = `<img src="${dataUrl}">`;
      } catch(err){ showToast("Rasmni yuklab bo'lmadi: " + err.message); }
    };
    document.getElementById('sendPaymentBtn').onclick = async ()=>{
      const amount = document.getElementById('payAmount').value;
      if(!amount || Number(amount)<=0){ showToast("Summani kiriting"); return; }
      if(!state.pendingReceipt){ showToast("Chek yoki skrinshot yuklang"); return; }
      try{
        await api('/api/payments', { method:'POST', body: JSON.stringify({ amount, receiptImage: state.pendingReceipt }) });
        state.pendingReceipt = null;
        showToast("To'lov yuborildi, admin tasdiqlaydi ✅");
        await renderTab();
      } catch(e){ showToast(e.message); }
    };
    const ordersHtml = !orders.length ? `<div class="empty">📦<br><br>Hali buyurtma tushmagan</div>` : `<div class="sectitle" style="margin:16px 0 12px">Kelgan buyurtmalar</div>` + orders.map(o=>{
      const myCommission = o.items.reduce((s,it)=>s+(it.commission||0),0);
      const myDelivery = o.items.reduce((s,it)=>s+(it.deliveryFee||0),0);
      const myPayout = o.items.reduce((s,it)=>s+(it.payout||it.price*it.qty),0) + myDelivery;
      return `<div class="oitem">
        <div class="top"><span>№${o.id} · ${o.buyerName} · ${o.phone}</span><span class="status">${o.status}</span></div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px">📍 ${o.region ? o.region+', ' : ''}${o.address}</div>
        ${o.items.map(it=>`<div class="oline"><span>${it.name} × ${it.qty}</span><span>${fmt(it.price*it.qty)}</span></div>`).join('')}
        ${myDelivery ? `<div class="oline"><span>🚚 Yetkazib berish</span><span>${fmt(myDelivery)}</span></div>` : ''}
        <div class="oline" style="color:var(--red)"><span>Komissiya (1%)</span><span>−${fmt(myCommission)}</span></div>
        <div class="ototal"><span>Sizga tushum</span><span>${fmt(myPayout)}</span></div>
        <select class="statusSel" data-order="${o.id}">
          ${['yangi','tasdiqlandi',"kuryerga topshirildi",'yetkazildi','bekor qilindi'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>`;
    }).join('');
    main.insertAdjacentHTML('beforeend', ordersHtml);
    main.querySelectorAll('.statusSel').forEach(s=>s.onchange=async()=>{
      await api('/api/orders/'+s.dataset.order+'/status', { method:'PATCH', body: JSON.stringify({ status:s.value }) });
      showToast("Holat yangilandi");
    });
  }
}

          <div style="font-size:12px;color:var(--muted);margin-bottom:4px">📍 ${o.region ? o.region+', ' : ''}${o.address}</div>
          ${o.items.map(it=>`<div class="oline"><span>${it.name} × ${it.qty}</span><span>${fmt(it.price*it.qty)}</span></div>`).join('')}
          <div class="ototal"><span>Jami</span><span>${fmt(o.total)}</span></div>
          <div class="field" style="margin-top:8px"><label>Admin izohi</label><textarea class="adminNoteInput" data-order="${o.id}" rows="2" placeholder="Izoh yozing...">${o.adminNote||''}</textarea></div>
          <button class="addbtn" style="background:var(--violet-dk)" data-savenote="${o.id}">Izohni saqlash</button>
        </div>`).join('') : `<div class="empty">Hali buyurtma yo'q</div>`);
    main.querySelectorAll('[data-savenote]').forEach(btn=>btn.onclick=async()=>{
      const oid = btn.dataset.savenote;
      const note = main.querySelector(`.adminNoteInput[data-order="${oid}"]`).value;
      await api('/api/admin/orders/'+oid, { method:'PATCH', body: JSON.stringify({ adminNote: note }) });
      showToast("Izoh saqlandi");
    });
  }

  else if(state.tab==='payments'){
    const { payments } = await api('/api/admin/payments');
    main.innerHTML = `<div class="sectitle" style="margin-bottom:12px">To'lovlar (${payments.length})</div>` +
      (payments.length ? payments.map(p=>`
        <div class="oitem">
          <div class="top"><span style="font-weight:700">${p.sellerName}</span><span class="status" style="background:${p.status==='tasdiqlandi'?'#E6F4EA':p.status==='rad etildi'?'#FDEDED':'var(--violet-lt)'};color:${p.status==='tasdiqlandi'?'#1E7E34':p.status==='rad etildi'?'var(--red)':'var(--violet-dk)'}">${p.status}</span></div>
          <div class="oline"><span>Summa</span><span style="font-weight:800">${fmt(p.amount)}</span></div>
          <div style="font-size:11px;color:var(--muted);margin:4px 0">${new Date(p.createdAt).toLocaleString('uz')}</div>
          <div class="imgpreview" style="height:160px;margin-bottom:8px"><img src="${p.receiptImage}" style="cursor:pointer" data-fullimg="${p.id}"></div>
          ${p.status==='kutilmoqda' ? `
          <div style="display:flex;gap:6px">
            <button class="addbtn" style="background:#1E7E34" data-approve="${p.id}">Tasdiqlash</button>
            <button class="addbtn" style="background:var(--red)" data-reject="${p.id}">Rad etish</button>
          </div>` : (p.adminNote ? `<div style="font-size:11.5px;color:var(--muted)">Izoh: ${p.adminNote}</div>` : '')}
        </div>`).join('') : `<div class="empty">Hali to'lov yo'q</div>`);
    main.querySelectorAll('[data-fullimg]').forEach(img=>img.onclick=()=>{ window.open(img.src, '_blank'); });
    main.querySelectorAll('[data-approve]').forEach(btn=>btn.onclick=async()=>{
      await api('/api/admin/payments/'+btn.dataset.approve, { method:'PATCH', body: JSON.stringify({ status:'tasdiqlandi' }) });
      showToast("To'lov tasdiqlandi ✅"); await renderTab();
    });
    main.querySelectorAll('[data-reject]').forEach(btn=>btn.onclick=async()=>{
      const note = prompt("Rad etish sababi (ixtiyoriy):") || '';
      await api('/api/admin/payments/'+btn.dataset.reject, { method:'PATCH', body: JSON.stringify({ status:'rad etildi', adminNote: note }) });
      showToast("To'lov rad etildi"); await renderTab();
    });
  }
}

// ---------- Ishga tushirish ----------
(async function init(){
  if(state.token){
    try{
      const { user } = await api('/api/me');
      state.user = user; renderApp();
      return;
    } catch(e){ localStorage.removeItem('savdouz_token'); state.token=null; }
  }
  renderAuth();
})();
</script>
</body>
</html>
