<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SavdoUz Taksi</title>
<style>
:root{--g:#0B6B52;--ink:#14201B;--mut:#5B6B63;--bg:#F3F5F2;--ln:#E1E7E3;--red:#7A160D;--yel:#5C4000}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif}
.app{max-width:440px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:21px;margin:4px 0 12px}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-top:6px}
input,select{width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:12px;font:inherit;margin:4px 0 8px;background:#fff}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:800;font-size:15px;margin-top:8px;cursor:pointer;text-align:center;padding:12px;text-decoration:none}
.btn:disabled{opacity:.45}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.bad{background:var(--red)}
.btn.sm{display:inline-block;width:auto;min-height:40px;padding:8px 14px;font-size:13px;margin:6px 6px 0 0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.st{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:#E3F1EC;color:var(--g);white-space:nowrap}
.note{font-size:13px;color:var(--mut);margin:6px 0}
.big{font-size:28px;font-weight:800}
.bal{border-radius:18px;padding:14px;margin-bottom:12px;background:#fff}
.bal.yel{background:#FFF1C7;color:var(--yel)}.bal.red{background:#FADBD8;color:var(--red)}
.dark{background:var(--ink);color:#fff;border-radius:14px;padding:12px;margin:8px 0}
.dark .btn{background:#fff;color:var(--ink)}
.cn{font-size:21px;font-weight:800;letter-spacing:1px;margin:4px 0}
.code{background:#E3F1EC;padding:2px 10px;border-radius:8px;font-size:17px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--ln);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-height:46px;border:0;background:none;font:inherit;font-weight:700;color:var(--mut)}
nav button.on{color:var(--g);font-weight:800}
.warn{background:#FFF1C7;color:var(--yel);border-radius:14px;padding:12px;margin-bottom:12px;font-weight:700}
.c{text-align:center}a{color:var(--g);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:99999}
#toast.on{opacity:1}
.prev{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--g);display:block;margin:6px 0}
.prevd{width:140px;border-radius:10px;display:block;margin:6px 0}
/* selfi kamerasi */
#cam{position:fixed;inset:0;z-index:9000;background:#000;display:none;flex-direction:column}
#cam.on{display:flex}
#camBox{position:relative;flex:1;overflow:hidden}
#camBox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#camBox svg{position:absolute;inset:0;width:100%;height:100%}
#camHint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 18px);text-align:center;color:#fff;font-weight:800;font-size:16px;text-shadow:0 1px 6px #000;padding:0 20px}
#camBar{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:10px;background:#000}
#camBar .btn{margin:0}
/* ===== Haydovchi: qorong'u dizayn (SavdoUz Taksi Driver) ===== */
body.dk{background:#080f1f;color:#fff}
.dk label{color:#aab3d6}
.dk .app{max-width:480px;padding:0 0 118px}
.dk h1{color:#fff}
.dk .note{color:#aab3d6}
.dk .card{background:#121c36;color:#fff;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.dk input,.dk select{background:#0c172d;color:#fff;border-color:#2a3a73}
.dk .btn{background:#FFC529;color:#111}
.dk .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.dk .btn.bad{background:#b3261e;color:#fff}
.dk .st{background:#2a3a73;color:#fff}
.dk .bal{background:#121c36;color:#fff}
.dk .bal.yel{background:#4a3a00;color:#ffd45a}
.dk .bal.red{background:#4a1612;color:#ffb4ab}
.dk .warn{background:#4a3a00;color:#ffd45a}
.dk .dark{background:#0c172d}
.dk .dark .btn{background:#FFC529;color:#111}
.dk .code{background:#2a3a73;color:#fff}
.dk a{color:#FFC529}
.dk #toast{bottom:104px}
.dkh{position:relative;background:#02102f;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.dkh img{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none}
.dkfb{display:none;padding:34px 22px 30px;font-size:34px;font-weight:900;font-style:italic;line-height:1.05}
.dkfb span{color:#FFC529}.dkfb small{display:block;margin-top:10px;font-size:15px;font-weight:700;font-style:normal}
.dkh.nof .dkfb{display:block}.dkh.nof img{display:none}
.dkbell{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:50%;border:0;padding:0;background:rgba(8,15,38,.94);box-shadow:0 0 0 1px rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff}
.dkbell svg{width:22px;height:22px;fill:#fff}
.dkbell i{position:absolute;left:26px;top:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff3b30;color:#fff;font:700 12px/20px -apple-system,'Segoe UI',Roboto,sans-serif;font-style:normal;text-align:center}
.dkp{padding:0 14px}
.dkpg{padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
.dkpg h1{margin:4px 2px 12px}
.dkst{display:flex;align-items:center;gap:14px;margin-top:-8px;position:relative;background:#101a33;border-radius:22px;padding:14px 16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.4);border-bottom:2px solid rgba(255,196,0,.5)}
.dkst .wh{flex:none;width:46px;height:46px;color:#22c55e}.dkst .wh svg{width:100%;height:100%;fill:currentColor}
.dkst.off .wh{color:#7a86ad}
.dkst .tx{flex:1;min-width:0}.dkst .tx b{display:block;font-size:22px;line-height:1.15}
.dkst .tx b:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-right:8px;vertical-align:middle}
.dkst.off .tx b:before{background:#7a86ad}
.dkst .tx small{display:block;color:#c9d0ee;font-size:12.5px;margin-top:2px}
.dktg{flex:none;position:relative;width:62px;height:36px;border-radius:18px;border:0;background:#3a4568;padding:0;transition:background .2s}
.dktg:after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s}
.dktg.on{background:#FFC529}.dktg.on:after{left:30px}.dktg.dis{opacity:.5}
.dksg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.dksc{background:#121c36;border-radius:16px;padding:10px 4px 9px;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.dksc svg{width:26px;height:26px;fill:#FFC529;color:#FFC529;display:block;margin:0 auto 4px}
.dksc small{display:block;font-size:11px;line-height:1.15;color:#dfe4f7;min-height:26px}
.dksc b{display:block;font-size:19px;line-height:1.2;margin-top:2px}
.dktl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dkt{position:relative;display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 10px;border:0;border-radius:20px;background:linear-gradient(180deg,#18264b,#101b3a);color:#fff;text-align:left;font:inherit;font-weight:700;font-size:15px;line-height:1.15;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-bottom:2px solid rgba(255,196,0,.55)}
.dkt>svg{flex:none;width:34px;height:34px;fill:#FFC529;color:#FFC529}
.dkt span{flex:1;min-width:0}
.dkt .ch{flex:none;width:16px;height:16px;color:#fff}.dkt .ch svg{width:100%;height:100%}
.dkt em{position:absolute;right:8px;top:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#ff3b30;color:#fff;font:700 12px/22px -apple-system,'Segoe UI',Roboto,sans-serif;font-style:normal;text-align:center}
.dksup{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:20px;background:linear-gradient(90deg,#fed10a,#fdbd0b 60%,#feb20c);color:#111}
.dksup>svg{flex:none;width:38px;height:38px;fill:#111}
.dksup div{flex:1;min-width:0}.dksup b{display:block;font-size:16px;line-height:1.15}.dksup small{display:block;font-size:13px;font-style:italic;margin-top:2px}
.dksup a{flex:none;display:flex;align-items:center;gap:6px;background:#0b1020;color:#fff;border-radius:22px;padding:11px 16px;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.dksup a svg{width:18px;height:18px;fill:#FFC529}
.dknav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:50;display:flex;background:#0c172d;border-radius:26px 26px 0 0;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 8px);box-shadow:0 -4px 22px rgba(0,0,0,.55)}
.dknav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0 10px;border:0;background:none;color:#fff;font:inherit;font-size:13px;font-weight:500}
.dknav button svg{width:28px;height:28px;fill:currentColor}
.dknav button.on{color:#FFC529;font-weight:700}
.dknav button.on:after{content:"";position:absolute;bottom:0;width:64px;height:3px;border-radius:2px;background:#FFC529}
.dkov{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.dksb{width:100%;max-width:480px;background:#0c172d;color:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.dksb h3{font-size:20px;font-weight:900;margin:0 0 10px}.dksb p{color:#c9d0ee;font-size:14.5px;margin:8px 0}
.dkrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:15px}
.dkrow:first-of-type{border-top:0}.dkrow span{color:#aab3d6}
.dkbox{background:#121c36;border-radius:18px;padding:14px 16px;margin-bottom:10px}.dkbox .l{color:#aab3d6;font-size:13px}.dkbox .v{font-size:26px;font-weight:900;line-height:1.2;margin-top:2px}
.dk2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.dk2 .dkbox{margin:0}
.dm{margin-top:10px;padding:12px 14px;border-radius:16px;background:linear-gradient(180deg,#4a3a00,#2f2500);color:#ffd45a;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,196,0,.35)}
.dm .l{font-size:13px;opacity:.95}.dm .v{font-size:32px;font-weight:900;line-height:1.15;color:#fff}.dm .s{font-size:13px;margin-top:2px}
/* ===== Buyurtmalar ekrani (rasmdagi dizayn) ===== */
.ordpg{min-height:100vh;background:linear-gradient(180deg,#031a53 0,#031a53 110px,#020f33 420px,#010a26 100%)}
.ordh{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none}
.ordfb{display:none;padding:28px 16px 6px;font-size:28px;margin:0}.ordpg.nof .ordfb{display:block}.ordpg.nof .ordh{display:none}
.ordb{padding:0 14px}
.osec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px}
.osec h2{margin:0;font-size:19px;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px}
.osec h2:before{content:"";width:5px;height:26px;border-radius:3px;background:#FFC529;flex:none}
.opill{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:18px;border:0;background:linear-gradient(180deg,#0b3fa8,#082a78);color:#fff;font:inherit;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px rgba(90,150,255,.5)}
.opill svg{width:13px;height:13px;color:#fff}
.ocard{position:relative;border-radius:26px;padding:14px;margin-bottom:14px;background:linear-gradient(180deg,#05266f,#031b55);border:2px solid #2f80ff;box-shadow:0 0 22px rgba(47,128,255,.55),inset 0 0 22px rgba(47,128,255,.22);overflow:hidden}
.ocard:before{content:"";position:absolute;right:0;bottom:64px;width:58%;height:58%;pointer-events:none;background:repeating-linear-gradient(62deg,rgba(90,150,255,.14) 0 2px,transparent 2px 24px),repeating-linear-gradient(-28deg,rgba(90,150,255,.10) 0 2px,transparent 2px 28px);-webkit-mask-image:radial-gradient(circle at 70% 55%,#000,transparent 72%);mask-image:radial-gradient(circle at 70% 55%,#000,transparent 72%)}
.ohd{display:flex;align-items:center;gap:10px;position:relative}
.oic{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a93ff,#1252d8);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(47,128,255,.18),0 0 0 12px rgba(47,128,255,.08)}
.oic svg{width:25px;height:25px;fill:#fff}
.ohd b{flex:1;min-width:0;font-size:17px;line-height:1.2;color:#fff;white-space:nowrap}
.oprice{flex:none;display:flex;align-items:center;gap:5px;padding:6px 7px 6px 11px;border-radius:20px;background:linear-gradient(180deg,#0b3fa8,#082a78);box-shadow:inset 0 0 0 1px rgba(90,150,255,.55);font-weight:800;font-size:13px;color:#fff;white-space:nowrap}
.oprice svg{width:22px;height:22px}.orow .sm svg{width:24px;height:24px}
.odt{position:relative;z-index:1;margin:14px 0 4px 56px;padding-right:72px;display:grid;gap:8px;font-size:14px;color:#e6edff}
.odt div{display:flex;align-items:center;gap:10px}
.odt svg{flex:none;width:18px;height:18px;fill:#d5e4ff;color:#d5e4ff}
.opin{position:absolute;right:8px;bottom:84px;width:66px;height:76px}
.obtn{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:14px;min-height:60px;border:0;border-radius:22px;background:linear-gradient(180deg,#ffd326,#f6a400);color:#10131c;font:inherit;font-weight:800;font-size:19px;box-shadow:0 0 18px rgba(255,190,0,.35),inset 0 2px 0 rgba(255,255,255,.55)}
.obtn svg{width:30px;height:30px;fill:#10131c}.obtn .ch{position:absolute;right:20px;width:20px;height:20px;color:#10131c}.obtn .ch svg{width:100%;height:100%}
.orow{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:12px;border-radius:24px;background:linear-gradient(180deg,#06235f,#041a4b);border:1.5px solid rgba(60,125,255,.6);box-shadow:0 0 14px rgba(47,128,255,.3),inset 0 0 14px rgba(47,128,255,.12);width:100%;color:#fff;font:inherit;text-align:left}
.orow .oic{width:50px;height:50px;box-shadow:none}
.orow .mid{flex:1;min-width:0}.orow .mid b{display:block;font-size:17px}
.orow .sm{display:flex;align-items:center;gap:8px;color:#d9e5ff;margin-top:3px;font-size:15px}
.ost{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:18px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(180deg,#14803a,#0d6a2e);box-shadow:inset 0 0 0 1px rgba(90,220,140,.45)}
.ost.bad{background:linear-gradient(180deg,#a8281f,#8a1d16);box-shadow:inset 0 0 0 1px rgba(255,130,120,.4)}
.ost svg{width:18px;height:18px}
.orow>.ch{flex:none;width:16px;height:16px;color:#fff}.orow>.ch svg{width:100%;height:100%}
.dknav{box-shadow:0 -4px 22px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,196,0,.4)}
.dknav button.on{background:rgba(120,160,255,.10);border-radius:20px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toast"></div>
<div id="cam"><div id="camBox"><video id="camV" playsinline muted autoplay></video>
<svg id="camSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="camHint">Yuzingizni doira ichiga joylashtiring</div></div>
<div id="camBar"><button class="btn ghost" id="camCancel">Bekor qilish</button><button class="btn" id="camShot" disabled>Suratga olish</button></div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU') + " so'm";
const MODE = location.pathname.indexOf('admin') > -1 ? 'admin' : 'driver';
const TITLE = MODE === 'admin' ? 'Taksi admin' : 'SavdoUz Taksi';
document.title = TITLE;
const ST = { yangi: 'Yangi', qabul: "Yo'lda (yo'lovchiga)", keldi: 'Yo\'lovchi kutmoqda', yolda: 'Safarda', yetkazildi: 'Tugadi', bekor: 'Bekor qilindi' };
let WAT = 0;
let TOKEN = localStorage.getItem('svtx_' + MODE), ME = null, INFO = null, TAB = 'home', ORD = [], OPEN = [], TUP = [], AD = null;
let AUTH = 'login', CODE = null, lastMax = null, SELFIE = null, SIG = '';

function toast(m) { const t = $('toast'); t.textContent = m; t.className = 'on'; clearTimeout(window._t); window._t = setTimeout(() => t.className = '', 2800); }
function logout() { stopGPS(); localStorage.removeItem('svtx_' + MODE); TOKEN = null; ME = null; TAB = 'home'; render(); }
async function api(path, method, body) {
  const r = await fetch('/api/taxi' + path, { method: method || 'GET', headers: Object.assign({ 'Content-Type': 'application/json' }, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}), body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401 && TOKEN) logout(); throw new Error(d.error || 'Xato'); }
  return d;
}
function readImage(file, max) {
  max = max || 1000;
  return new Promise((ok, no) => {
    if (!file) return no(new Error('Rasm tanlanmagan'));
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      let w = im.width, h = im.height;
      if (w > h && w > max) { h = Math.round(h * max / w); w = max; } else if (h > max) { w = Math.round(w * max / h); h = max; }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(im, 0, 0, w, h);
      ok(cv.toDataURL('image/jpeg', .72)); }; im.onerror = () => no(new Error("Rasm formati noto'g'ri")); im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
let AC = null;
function beep() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); [880, 660, 880].forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * .2; o.frequency.value = f; g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .2); }); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} }
const nav = items => `<nav>${items.map(([k, l]) => `<button data-act="tab" data-t="${k}" class="${TAB === k ? 'on' : ''}">${l}</button>`).join('')}</nav>`;
const gmap = p => `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;

// ---------- GPS (haydovchi joyi yo'lovchiga ko'rinadi, har soniyada yangilanadi) ----------
let GPSID = null, GPSTM = null, LASTPOS = null, WAKE = null;
function startGPS() {
  if (GPSID !== null || !navigator.geolocation) return;
  GPSID = navigator.geolocation.watchPosition(p => { LASTPOS = p.coords; }, e => { if (e.code === 1) toast("Joylashuvga ruxsat bering (Sozlamalar)"); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  GPSTM = setInterval(() => { if (LASTPOS && TOKEN && MODE === 'driver') api('/d/loc', 'POST', { lat: LASTPOS.latitude, lng: LASTPOS.longitude, speed: LASTPOS.speed }).catch(() => {}); }, 1000);
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => WAKE = w).catch(() => {}); } catch (e) {}
}
function stopGPS() {
  if (GPSID !== null) { navigator.geolocation.clearWatch(GPSID); GPSID = null; }
  if (GPSTM) { clearInterval(GPSTM); GPSTM = null; }
  try { if (WAKE) { WAKE.release(); WAKE = null; } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && GPSID !== null && navigator.wakeLock) navigator.wakeLock.request('screen').then(w => WAKE = w).catch(() => {}); });

// ---------- Selfi kamerasi (doira ichida yuz) ----------
let CAMSTREAM = null, CAMTM = null, FD = null, CAMOK = false;
function camMask() {
  // 100x100 koordinata: qorong'u fon + o'rtada yumaloq teshik; doira markazi ekranning 45% balandligida
  $('camSvg').innerHTML = `<defs><mask id="mk"><rect width="100" height="100" fill="#fff"/><ellipse id="cEl" cx="50" cy="45" rx="35" ry="20" fill="#000"/></mask></defs><rect width="100" height="100" fill="rgba(0,0,0,.65)" mask="url(#mk)"/><ellipse id="cEl2" cx="50" cy="45" rx="35" ry="20" fill="none" stroke="#fff" stroke-width=".6"/>`;
  // ekran nisbatiga qarab doira yumaloq bo'lsin
  const box = $('camBox'), w = box.clientWidth, h = box.clientHeight, r = Math.min(w, h) * 0.36;
  const rx = r / w * 100, ry = r / h * 100;
  ['cEl', 'cEl2'].forEach(i => { const e = $(i); e.setAttribute('rx', rx); e.setAttribute('ry', ry); });
  return { r, cx: w / 2, cy: h * 0.45, w, h };
}
async function openCam() {
  return new Promise(async (resolve, reject) => {
    const cam = $('cam'), v = $('camV'); cam.classList.add('on');
    const done = (val, err) => { clearInterval(CAMTM); if (CAMSTREAM) CAMSTREAM.getTracks().forEach(t => t.stop()); CAMSTREAM = null; v.srcObject = null; cam.classList.remove('on'); $('camShot').onclick = $('camCancel').onclick = null; err ? reject(err) : resolve(val); };
    try {
      CAMSTREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    } catch (e) { cam.classList.remove('on'); return reject(new Error('CAM')); }
    v.srcObject = CAMSTREAM; try { await v.play(); } catch (e) {}
    const g = camMask();
    const hasFD = 'FaceDetector' in window;
    if (hasFD) { try { FD = FD || new FaceDetector({ fastMode: true, maxDetectedFaces: 1 }); } catch (e) { FD = null; } }
    const shot = $('camShot'), hint = $('camHint');
    shot.disabled = true; hint.textContent = 'Yuzingizni doira ichiga joylashtiring';
    const vw = () => v.videoWidth || 640, vh = () => v.videoHeight || 480;
    // video "cover" bo'lib ekranga sig'adi: ekran -> video koordinata
    const map = () => { const s = Math.max(g.w / vw(), g.h / vh()); return { s, ox: (vw() * s - g.w) / 2, oy: (vh() * s - g.h) / 2 }; };
    CAMTM = setInterval(async () => {
      if (!v.videoWidth) return;
      if (!FD) { shot.disabled = false; return; }
      try {
        const f = await FD.detect(v);
        if (!f.length) { shot.disabled = true; hint.textContent = 'Yuz topilmadi. Doira ichiga qarang'; return; }
        const bb = f[0].boundingBox, mm = map();
        // ekran koordinatasida (oyna ko'zgusi hisobga olinadi)
        const fx = g.w - ((bb.x + bb.width / 2) * mm.s - mm.ox), fy = (bb.y + bb.height / 2) * mm.s - mm.oy, fw = bb.width * mm.s;
        const inside = Math.hypot(fx - g.cx, fy - g.cy) < g.r * 0.45 && fw > g.r * 0.7 && fw < g.r * 2.1;
        shot.disabled = !inside;
        hint.textContent = inside ? "Yaxshi! Suratga oling" : (fw <= g.r * 0.7 ? 'Yaqinroq keling' : fw >= g.r * 2.1 ? 'Uzoqroq turing' : "Yuzingizni doira o'rtasiga qo'ying");
      } catch (e) { shot.disabled = false; }
    }, 300);
    shot.onclick = () => {
      const mm = map(), side = g.r * 2.3, sx = (g.cx - side / 2 + mm.ox) / mm.s, sy = (g.cy - side / 2 + mm.oy) / mm.s, ss = side / mm.s;
      const cv = document.createElement('canvas'); cv.width = cv.height = 480;
      const ctx = cv.getContext('2d');
      ctx.drawImage(v, Math.max(0, sx), Math.max(0, sy), Math.min(ss, vw() - Math.max(0, sx)), Math.min(ss, vh() - Math.max(0, sy)), 0, 0, 480, 480);
      done(cv.toDataURL('image/jpeg', .8));
    };
    $('camCancel').onclick = () => done(null, new Error('Bekor qilindi'));
  });
}

const UZ_ONES = ['', 'bir', 'ikki', 'uch', "to'rt", 'besh', 'olti', 'yetti', 'sakkiz', "to'qqiz"];
const UZ_TENS = ['', "o'n", 'yigirma', "o'ttiz", 'qirq', 'ellik', 'oltmish', 'yetmish', 'sakson', "to'qson"];
function uzNum(n) {
  n = Math.round(Number(n) || 0); if (n <= 0) return 'nol';
  const part = x => { const h = Math.floor(x / 100), tt = Math.floor(x % 100 / 10), o = x % 10; return [h ? (h > 1 ? UZ_ONES[h] + ' ' : '') + 'yuz' : '', UZ_TENS[tt], UZ_ONES[o]].filter(Boolean).join(' '); };
  const m = Math.floor(n / 1e6), k = Math.floor(n % 1e6 / 1000), r = n % 1000;
  return [m ? part(m) + ' million' : '', k ? (k === 1 ? '' : part(k) + ' ') + 'ming' : '', r ? part(r) : ''].filter(Boolean).join(' ');
}
let VOICES = [];
function loadVoices() { try { VOICES = (window.speechSynthesis && speechSynthesis.getVoices()) || []; } catch (e) { VOICES = []; } return VOICES; }
function voiceFor(lang) { return loadVoices().find(v => new RegExp('^' + lang, 'i').test(v.lang)) || null; }
// Ruscha ovoz lotin harfli o'zbekcha matnni o'qiy olmaydi -> kirill harfiga o'giramiz
const CYR1 = { a: 'а', b: 'б', d: 'д', e: 'э', f: 'ф', g: 'г', h: 'х', i: 'и', j: 'ж', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', q: 'к', r: 'р', s: 'с', t: 'т', u: 'у', v: 'в', x: 'х', y: 'й', z: 'з' };
const CYR2 = { sh: 'ш', ch: 'ч', yo: 'ё', yu: 'ю', ya: 'я', ye: 'е' };
function toCyr(t) {
  return String(t).toLowerCase().replace(/[ʻʼ’‘`´]/g, "'").replace(/o'/g, '\u0001').replace(/g'/g, '\u0002')
    .replace(/sh|ch|yo|yu|ya|ye|[a-z\u0001\u0002']/g, m => m === '\u0001' ? 'о' : m === '\u0002' ? 'г' : m === "'" ? '' : (CYR2[m] || CYR1[m] || m));
}
// tillar tartibi: o'zbekcha -> turkcha (eng yaqin) -> ruscha (kirillda) -> inglizcha
const SAY_LANGS = [{ re: 'uz', lang: 'uz-UZ' }, { re: 'tr', lang: 'tr-TR' }, { re: 'ru', lang: 'ru-RU', cyr: true }, { re: 'en', lang: 'en-US' }];
let speakSeq = 0, speechUnlocked = false;
// Android/WebView: birinchi bosishda ovoz tizimini "uyg'otib" qo'yamiz
function unlockSpeech() {
  if (speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'en-US'; speechSynthesis.speak(u); } catch (e) {}
}
['touchstart', 'click'].forEach(ev => document.addEventListener(ev, unlockSpeech, { once: true, passive: true }));
function saySys(text, done) {
  try {
    if (!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) { done && done(false); return false; }
    const synth = window.speechSynthesis, my = ++speakSeq, haveList = loadVoices().length > 0;
    // ESLATMA: <html lang="uz"> bo'lgani uchun lang berilmasa ovoz jim qoladi. Shuning uchun lang HAR DOIM aniq beriladi.
    let cands = haveList ? SAY_LANGS.filter(l => voiceFor(l.re)) : SAY_LANGS;
    if (!cands.length) cands = SAY_LANGS;
    const attempt = i => {
      if (my !== speakSeq) return;
      if (i >= cands.length) { done && done(false); return; }
      const c = cands[i], v = haveList ? voiceFor(c.re) : null, t0 = Date.now();
      const u = new SpeechSynthesisUtterance(c.cyr ? toCyr(text) : text);
      u.lang = v ? v.lang : c.lang; if (v) u.voice = v;
      u.rate = 0.95; u.volume = 1; u.pitch = 1;
      let state = 0; // 0 kutilmoqda, 1 boshlandi, 2 o'chirildi (keyingisiga o'tildi)
      const ok = () => { if (state) return; state = 1; done && done(true); };
      const next = () => { if (state) return; state = 2; try { synth.cancel(); } catch (e) {} setTimeout(() => attempt(i + 1), 150); };
      u.onstart = ok;
      u.onend = () => { if (Date.now() - t0 > 800) ok(); else next(); };   // juda tez tugasa — aslida gapirmagan
      u.onerror = e => { if (e.error !== 'canceled' && e.error !== 'interrupted') next(); };
      setTimeout(() => { if (state === 0 && my === speakSeq) { if (synth.speaking) ok(); else next(); } }, 3500);
      synth.speak(u);
      try { synth.resume(); } catch (e) {}
    };
    try { synth.cancel(); } catch (e) {}
    setTimeout(() => attempt(0), 150);   // cancel() dan keyin darrov speak() Chrome'da yutilib ketadi
    return true;
  } catch (e) { done && done(false); return false; }
}

// ---- Internet ovozi (zaxira): tizim ovozi jim bo'lsa yoki umuman bo'lmasa (WebView) ----
let NETA = null;
function sayNet(text, done) {
  const my = ++speakSeq, parts = []; let cur = '';
  String(text).split(/\s+/).forEach(w => { if ((cur + ' ' + w).length > 170) { parts.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; });
  if (cur) parts.push(cur);
  const LG = ['uz', 'tr']; let started = false, failed = false;
  const fail = () => { if (!started && !failed) { failed = true; done && done(false); } };
  const play = (i, li) => {
    if (my !== speakSeq || i >= parts.length) return;
    try {
      const a = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + LG[li] + '&q=' + encodeURIComponent(parts[i]));
      NETA = a; a.volume = 1;
      let got = false;
      a.onplaying = () => { got = true; if (!started) { started = true; done && done(true); } };
      a.onended = () => play(i + 1, li);
      const bad = () => { if (got) return play(i + 1, li); if (li + 1 < LG.length) play(i, li + 1); else fail(); };
      a.onerror = bad;
      const p = a.play(); if (p && p.catch) p.catch(bad);
    } catch (e) { fail(); }
  };
  play(0, 0);
}
function sayLegacy(text, done) {
  let mode = null; try { mode = localStorage.getItem('svtx_voice'); } catch (e) {}
  const first = mode === 'net' ? sayNet : saySys, second = mode === 'net' ? saySys : sayNet;
  try { if (NETA) NETA.pause(); } catch (e) {}
  let fin = false;
  first(text, ok => { if (ok) { if (!fin) { fin = true; done && done(true); } } else second(text, ok2 => { if (fin) return; fin = true; done && done(!!ok2); }); });

}

// ---- Server ovozi: haqiqiy odam ovoziga o'xshash neyron o'zbek ovozi (POST /api/taxi/tts -> mp3) ----
let SRVA = null; const TTSC = {};
function saySrv(text, done) {
  const my = ++speakSeq; let fin = false;
  const end = ok => { if (!fin) { fin = true; done && done(ok); } };
  const play = url => {
    if (my !== speakSeq) return;
    try { const a = new Audio(url); SRVA = a; a.onplaying = () => end(true); a.onerror = () => end(false); const p = a.play(); if (p && p.catch) p.catch(() => end(false)); } catch (e) { end(false); }
  };
  if (TTSC[text]) return play(TTSC[text]);
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 6000);
  fetch('/api/taxi/tts', { method: 'POST', signal: ac.signal, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN }, body: JSON.stringify({ text }) })
    .then(r => { if (!r.ok) throw new Error('tts'); return r.blob(); })
    .then(b => { clearTimeout(tm); if (!b.size) throw new Error('empty'); TTSC[text] = URL.createObjectURL(b); play(TTSC[text]); })
    .catch(() => { clearTimeout(tm); end(false); });
}
function say(text, done) {

}

  if (!TOKEN) { a.innerHTML = authView(); showSelfie(SELFIE); return; }
  if (!ME || !INFO) { a.innerHTML = '<div class="card">Yuklanmoqda...</div>'; return; }
  const sig = JSON.stringify([TAB, ME, ORD.map(o => { const { wait, ...r } = o; return r; }), OPEN, TUP, AD ? AD.drivers.length + ':' + AD.topups.length + ':' + AD.orders.length : 0]);
  if (!force && sig === SIG) return;
  SIG = sig;
  a.innerHTML = MODE === 'driver' ? dView() : aView();
}
setInterval(() => { const e2 = $('tmr2'); if (e2 && ME && ME.workUntil) e2.textContent = hmLeft(); }, 1000);
setInterval(() => {
  const e = $('tmr'); if (e && ME && ME.workUntil) { const s = Math.max(0, Math.floor((new Date(ME.workUntil) - Date.now()) / 1000)); e.textContent = [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(x => String(x).padStart(2, '0')).join(':'); }
}, 1000);
setInterval(() => {
  if (!TOKEN || document.hidden || TAB === 'wallet') return;
  const a = document.activeElement; if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
  load();
}, 3000);

// ---------- Tugmalar ----------
const go = async (p, b, msg) => { try { await api(p, 'POST', b || {}); if (msg) toast(msg); SIG = ''; await load(); return true; } catch (e) { toast(e.message); return false; } };
const ACT = {
  swAuth() { AUTH = AUTH === 'reg' ? 'login' : 'reg'; render(); },
  out() { logout(); },
  tab(d) { TAB = d.t; SIG = ''; render(true); window.scrollTo(0, 0); },
  noOff() { toast("Safar tugamaguncha oflayn bo'lib bo'lmaydi"); },
  beepTest() {
    beep(); const has = 'speechSynthesis' in window, vs = loadVoices();
    sheet('Ovoz sinovi', `<p>Tizim ovozi: <b>${has ? 'bor' : "yo'q"}</b> · ovozlar soni: <b>${vs.length}</b>${vs.length ? '<br><small>' + esc(vs.slice(0, 8).map(v => v.lang).join(', ')) + '</small>' : ''}</p><button class="btn" data-act="vSrv">🎙 Server ovozi (tabiiy)</button><button class="btn ghost" data-act="vSys">🔊 Tizim ovozi bilan</button><button class="btn" data-act="vNet">🌐 Internet ovozi bilan</button><p class="note" id="vres">Tugmani bosing va eshiting. Eshitilgan usul saqlanadi.</p>`);
  },
  vSrv() { const r = $('vres'); r.textContent = 'Sinalmoqda...'; saySrv(GREET, ok => { r.textContent = ok ? '✅ Server ovozi ishlayapti.' : "❌ Server ovozi yo'q (serverga /api/taxi/tts qo'shilmagan yoki kalit xato)."; }); },
  vSys() { const r = $('vres'); r.textContent = 'Sinalmoqda...'; saySys(GREET, ok => { r.textContent = ok ? '✅ Tizim ovozi boshlandi. Eshitdingizmi? Ha bo\'lsa shu usul saqlandi.' : '❌ Tizim ovozi ishlamadi. "Internet ovozi" ni bosing.'; if (ok) try { localStorage.setItem('svtx_voice', 'sys'); } catch (e) {} }); },
  vNet() { const r = $('vres'); r.textContent = 'Sinalmoqda...'; sayNet(GREET, ok => { r.textContent = ok ? '✅ Internet ovozi boshlandi. Eshitdingizmi? Ha bo\'lsa shu usul saqlandi.' : "❌ Internet ovozi ham ishlamadi (internet yo'q yoki bloklangan)."; if (ok) try { localStorage.setItem('svtx_voice', 'net'); } catch (e) {} }); },
  ordAll() { ORDALL = !ORDALL; SIG = ''; render(true); },
  ordInfo(d) {
    const o = ORD.find(x => String(x.id) === String(d.id)); if (!o) return;
    const row = (l, v) => `<div class="dkrow"><span>${l}</span><b>${v}</b></div>`;
    sheet('Buyurtma №' + o.id, row('Holat', o.status === 'bekor' ? 'Bekor qilingan' : 'Tugagan') + row('Narx', fmt(o.fee) + (o.open ? ' dan' : '')) + row('Masofa', o.open ? 'manzilsiz' : o.km + ' km') + row('Tarif', esc(o.tariffName)) + (o.from && o.from.address ? row('Qayerdan', esc(o.from.address)) : '') + (o.to && o.to.address ? row('Qayerga', esc(o.to.address)) : ''));
  },
  sayFare(d) { say(fareText(Number(d.t), Number(d.w))); },
  closeSheet() { closeSheet(); },
  sheet(d) {
    if (d.k === 'safety') sheet('Xavfsizlik', `<p>• Yo'lovchini olishdan oldin buyurtma ma'lumotini tekshiring.</p><p>• Tezlik va yo'l qoidalariga rioya qiling, xavfsizlik kamarini taqing.</p><p>• Shubhali holatda safarni davom ettirmang va qo'llab-quvvatlashga yozing.</p>`);
    else sheet('Yordam', `<p>Savol yoki muammo bo'lsa, qo'llab-quvvatlash xizmatiga murojaat qiling.</p><p>• Buyurtmalar: <b>Buyurtmalar</b> bo'limida.</p><p>• Hisobni to'ldirish: <b>Hamyon</b> bo'limida.</p><p><a href="${SUPPORT_TEL ? 'tel:' + esc(SUPPORT_TEL) : SUPPORT_TG}" target="_blank">${SUPPORT_TEL ? esc(SUPPORT_TEL) : 'Telegram orqali yozish'}</a></p>`);
  },
  async selfie() {
    try { showSelfie(await openCam()); }
    catch (e) {
      if (e.message === 'CAM') {
        // kamera ochilmasa: oddiy selfi tanlash
        const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'user');
        inp.onchange = async () => { try { showSelfie(await readImage(inp.files[0], 640)); } catch (x) { toast(x.message); } };
        inp.click();
      } else if (e.message !== 'Bekor qilindi') toast(e.message);
    }
  },
  async auth() {
    const phone = $('f_phone').value.trim(), password = $('f_pw').value;
    try {
      let d;
      if (MODE === 'admin') {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, password }) });
        d = await r.json(); if (!r.ok) throw new Error(d.error || 'Xato'); if (d.user.role !== 'admin') throw new Error('Faqat admin kira oladi');
      } else if (AUTH === 'reg') {
        if (!SELFIE) throw new Error('Selfi oling');
        d = await api('/d/register', 'POST', { name: $('f_name').value, phone, password, klass: $('f_klass').value, car: $('f_car').value, plate: $('f_plate').value, techPassport: await readImage($('f_tech').files[0]), license: await readImage($('f_lic').files[0]), selfie: SELFIE });
      } else d = await api('/d/login', 'POST', { phone, password });
      TOKEN = d.token; localStorage.setItem('svtx_' + MODE, TOKEN); TAB = 'home'; SIG = ''; await load();
    } catch (e) { toast(e.message); }
  },
  copyCard() { try { navigator.clipboard.writeText(INFO.card.number.replace(/\s/g, '')); toast('Karta raqami nusxalandi'); } catch (e) { toast(INFO.card.number); } },
  async topup() {
    try {
      const amount = Number($('t_amt').value); if (!(amount > 0)) throw new Error('Summani kiriting');
      const f = $('t_rcp').files[0]; const receipt = f ? await readImage(f) : null;
      await api('/d/topup', 'POST', { amount, code: CODE, receipt }); CODE = null; toast("So'rov yuborildi. Admin tasdiqlagach balans oshadi"); SIG = ''; await load();
    } catch (e) { toast(e.message); }
  },
  workOn() { startGPS(); go('/d/work', { on: true }, 'Ish boshlandi'); },
  workOff() { go('/d/work', { on: false }, 'Dam oling'); },
  accept(d) { go('/d/orders/' + d.id + '/accept', {}, 'Buyurtma sizniki'); },
  arrived(d) { go('/d/orders/' + d.id + '/arrived', {}, "Yo'lovchiga xabar berildi"); },
  start(d) { go('/d/orders/' + d.id + '/start', {}, 'Safar boshlandi').then(ok => { if (ok) say(GREET); }); },
  done(d) {
    const lo = ORD.find(x => String(x.id) === String(d.id)), wf = lo ? waitNow(lo).fee : 0, total = Number(d.base || 0) + wf;
    if (d.open) {
      const v = prompt("Yo'lovchidan olgan naqd summani kiriting (so'm). Kamida " + total + (wf ? " (kutish haqi " + wf + " ham kiritilgan)" : ''), total);
      if (v === null) return;
      const amount = Math.round(Number(String(v).replace(/\D/g, '')));
      if (!amount || amount < total) return alert("Summa " + total + " so'mdan kam bo'lmasin");
      return go('/d/orders/' + d.id + '/done', { amount }, 'Safar tugadi').then(ok => { if (ok) finished(amount, wf); });
    }
    if (confirm("Safar tugadimi? Yo'lovchidan " + fmt(total) + " naqd oling" + (wf ? " (kutish haqi " + fmt(wf) + " bilan)" : '') + ".")) go('/d/orders/' + d.id + '/done', {}, 'Safar tugadi').then(ok => { if (ok) finished(total, wf); });
  },
  release(d) { if (confirm("Buyurtmani bekor qilasizmi? Ko'p bekor qilsangiz cheklanasiz")) go('/d/orders/' + d.id + '/release'); },
  dAct(d) { go('/admin/driver/' + d.id, { action: d.a }, 'Bajarildi'); },
  tAct(d) { go('/admin/topup/' + d.id, { action: d.a }, 'Bajarildi'); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !ACT[b.dataset.act]) return;
  if (b.tagName === 'A' && !b.getAttribute('href')) e.preventDefault();
  if (b.tagName === 'A' && b.getAttribute('href') === '#') e.preventDefault();
  if (b.disabled) return;
  ACT[b.dataset.act](b.dataset, b);
});
load();
</script>
</body>
</html>
